const CR12_SERVICE_CONTACTS = {
  "G11042622719": [
    { contactId:"C000001", nama:"Sinta", nomorHp:"08123456789", hubungan:"Istri", is_primary:true },
    { contactId:"C000002", nama:"Budi", nomorHp:"08129876543", hubungan:"Pemilik", is_primary:false },
    { contactId:"C000003", nama:"Andi", nomorHp:"08135555555", hubungan:"PIC", is_primary:false }
  ],
  "G09042622717": [
    { contactId:"C000002", nama:"Budi", nomorHp:"08129876543", hubungan:"Suami", is_primary:true },
    { contactId:"C000001", nama:"Sinta", nomorHp:"08123456789", hubungan:"Istri", is_primary:false }
  ],
  "BJ23032622700": [
    { contactId:"C000004", nama:"Rina", nomorHp:"08136666666", hubungan:"Pemilik", is_primary:true },
    { contactId:"C000005", nama:"Doni", nomorHp:"08137777777", hubungan:"PIC", is_primary:false }
  ],
  "KK23032622695": [
    { contactId:"C000006", nama:"Fajar", nomorHp:"08138888888", hubungan:"Pemilik", is_primary:true }
  ]
};

function CR12ServiceContacts({serviceId, onChanged}) {
  const [rows,setRows] = React.useState(() => (CR12_SERVICE_CONTACTS[serviceId] || []).map(x=>({...x})));
  const [edit,setEdit] = React.useState(null);
  const [pendingPrimary,setPendingPrimary] = React.useState(null);
  const [feedback,setFeedback] = React.useState(null);

  React.useEffect(() => {
    setRows((CR12_SERVICE_CONTACTS[serviceId] || []).map(x=>({...x})));
    setEdit(null);
    setPendingPrimary(null);
  },[serviceId]);

  const save = (nextRows) => {
    const primaryCount = nextRows.filter(x=>x.is_primary).length;
    if (primaryCount !== 1) {
      setFeedback({type:"error",message:"Perubahan gagal disimpan. Service harus memiliki satu Primary Contact."});
      return false;
    }
    // RULE BARU: satu nomorHp primary hanya di satu service (cek lintas CR12_SERVICE_CONTACTS by nomorHp).
    const promoted = nextRows.find(x=>x.is_primary && !rows.find(r=>r.contactId===x.contactId && r.is_primary));
    if (promoted) {
      const elsewhere = Object.keys(CR12_SERVICE_CONTACTS).find(sid => sid !== serviceId && (CR12_SERVICE_CONTACTS[sid]||[]).some(r=>r.nomorHp===promoted.nomorHp && r.is_primary));
      if (elsewhere) {
        setFeedback({type:"error",message:"Gagal: nomor " + promoted.nomorHp + " sudah menjadi Primary di layanan " + elsewhere + ". Satu nomor primary hanya bisa di satu layanan."});
        return false;
      }
    }
    CR12_SERVICE_CONTACTS[serviceId] = nextRows.map(x=>({...x}));
    setRows(nextRows);
    if (onChanged) onChanged(nextRows);
    setFeedback({type:"success",message:"Perubahan berhasil disimpan."});
    return true;
  };

  const commitPrimary = (row, makePrimary) => {
    if (row.is_primary && !makePrimary) {
      setFeedback({type:"error",message:"Primary Contact tidak dapat dinonaktifkan tanpa pengganti."});
      return;
    }
    if (!makePrimary) {
      setEdit(null);
      return;
    }
    if (row.is_primary) {
      setEdit(null);
      return;
    }
    // RULE BARU: cegah sebelum dialog konfirmasi.
    const elsewhere = Object.keys(CR12_SERVICE_CONTACTS).find(sid => sid !== serviceId && (CR12_SERVICE_CONTACTS[sid]||[]).some(r=>r.nomorHp===row.nomorHp && r.is_primary));
    if (elsewhere) {
      setFeedback({type:"error",message:"Gagal: nomor ini sudah menjadi Primary di layanan " + elsewhere + "."});
      return;
    }
    setPendingPrimary(row);
  };

  const confirmPrimary = () => {
    if (!pendingPrimary) return;
    const next = rows.map(x=>({...x,is_primary:x.contactId===pendingPrimary.contactId}));
    const ok = save(next);
    if (ok) {
      setPendingPrimary(null);
      setEdit(null);
    }
  };

  const relationshipOptions = ["Pemilik","Keluarga","Pasangan","Anak","Orang Tua","PIC","Karyawan","Lainnya"];

  return <React.Fragment>
    <div style={{display:"flex",flexDirection:"column",gap:7}}>
      {rows.map(row =>
        <div key={row.contactId} style={{display:"grid",gridTemplateColumns:"1.1fr 1fr 1fr .7fr auto",gap:8,alignItems:"center",padding:"8px 10px",border:`1px solid ${C.border}`,borderRadius:7,background:C.bgPanel}}>
          <div><div style={{fontSize:12,fontWeight:600,color:C.text}}>{row.nomorHp}</div><div style={{fontSize:10.5,color:C.textFaint}}>{row.nama}</div></div>
          <div style={{fontSize:11.5,color:C.text}}>{row.nama}</div>
          <div style={{fontSize:11.5,color:C.text}}>{row.hubungan}</div>
          <div style={{fontSize:11.5,color:row.is_primary?C.accent:C.textFaint,fontWeight:row.is_primary?700:500}}>{row.is_primary ? "✓ Primary" : "Non-primary"}</div>
          <button onClick={()=>setEdit({...row})} style={{fontSize:11,padding:"4px 8px",border:`1px solid ${C.border}`,borderRadius:6,background:C.bgPanel,color:C.accent,cursor:"pointer"}}>Edit</button>
        </div>
      )}
    </div>

    {edit && <Modal title="Edit Service Contact" onClose={()=>setEdit(null)}>
      <div className="flex flex-col gap-3">
        <InfoRow label="Nomor HP" value={edit.nomorHp}/>
        <InfoRow label="Nama Contact" value={edit.nama}/>
        <div>
          <label style={{fontSize:11,color:C.textFaint,fontWeight:600}}>Hubungan</label>
          <select value={edit.hubungan} onChange={e=>setEdit({...edit,hubungan:e.target.value})}
            style={{width:"100%",marginTop:4,padding:"7px 8px",border:`1px solid ${C.border}`,borderRadius:7,background:C.bgPanel,color:C.text,fontSize:12}}>
            {relationshipOptions.map(x=><option key={x}>{x}</option>)}
          </select>
        </div>
        <div>
          <label style={{fontSize:11,color:C.textFaint,fontWeight:600}}>Primary Contact</label>
          <select value={edit.is_primary ? "Yes":"No"} onChange={e=>commitPrimary(edit,e.target.value==="Yes")}
            style={{width:"100%",marginTop:4,padding:"7px 8px",border:`1px solid ${C.border}`,borderRadius:7,background:C.bgPanel,color:C.text,fontSize:12}}>
            <option value="Yes">Yes</option><option value="No" disabled={edit.is_primary}>No</option>
          </select>
          <div style={{fontSize:10.5,color:C.textFaint,marginTop:4}}>Service harus memiliki satu Primary Contact. Satu nomor Primary hanya bisa di satu layanan.</div>
        </div>
        <div className="flex justify-end gap-2">
          <button onClick={()=>setEdit(null)} style={{padding:"7px 12px",border:`1px solid ${C.border}`,borderRadius:7,background:C.bgPanel,color:C.text,cursor:"pointer"}}>Batal</button>
          <button onClick={()=>{
            const next=rows.map(x=>x.contactId===edit.contactId?{...x,hubungan:edit.hubungan}:x);
            save(next); setEdit(null);
          }} style={{padding:"7px 12px",border:0,borderRadius:7,background:C.accent,color:"#fff",cursor:"pointer",fontWeight:600}}>Simpan</button>
        </div>
      </div>
    </Modal>}

    {pendingPrimary && <Modal title="Konfirmasi Primary Contact" onClose={()=>setPendingPrimary(null)}>
      <div style={{fontSize:12.5,color:C.text,lineHeight:1.5,marginBottom:14}}>
        Jadikan <b>{pendingPrimary.nama}</b> sebagai Primary Contact?
      </div>
      <div className="flex justify-end gap-2">
        <button onClick={()=>setPendingPrimary(null)} style={{padding:"7px 12px",border:`1px solid ${C.border}`,borderRadius:7,background:C.bgPanel,color:C.text,cursor:"pointer"}}>Batal</button>
        <button onClick={confirmPrimary} style={{padding:"7px 12px",border:0,borderRadius:7,background:C.accent,color:"#fff",cursor:"pointer",fontWeight:600}}>Konfirmasi</button>
      </div>
    </Modal>}

    {feedback && <CR12Toast message={feedback.message} type={feedback.type} onClose={()=>setFeedback(null)}/>}
  </React.Fragment>;
}

function maskNik(nik) {
  if (!nik) return "-";
  return nik.slice(0, 4) + "••••••••" + nik.slice(-4);
}
function formatPhoneDisplay(n) {
  if (!n) return "-";
  return n;
}
function statusColor(status) {
  const s = (status || "").toLowerCase();
  if (s === "active") return { fg: C.success, bg: C.successSoft, label: "Active" };
  if (s === "isolir") return { fg: C.warning, bg: C.warningSoft, label: "Isolir" };
  if (s === "terminated") return { fg: C.danger, bg: C.dangerSoft, label: "Terminated" };
  if (s === "non active" || s === "inactive") return { fg: C.danger, bg: C.dangerSoft, label: "Non Active" };
  return { fg: C.textSoft, bg: C.bgPanelAlt, label: status || "-" };
}
function deriveUserStatus(userId, services) {
  const owned = services.filter(s => s.userId === userId);
  if (!owned.length) return "Non-active";
  return owned.some(s => s.status === "Active" || s.status === "Isolir") ? "Active" : "Non-active";
}

/* ============================================================
   SHARED "COCOKKAN LAYANAN" MATCHING LOGIC
   Dipakai oleh SEMUA tombol Cocokkan Layanan (identified number,
   unidentified number, Contact Profile, Contact > Detail Contact)
   supaya validasi & behaviour selalu konsisten.
   ============================================================ */
function evaluateServiceMatch(query, allServices, alreadyLinkedPppoeSet) {
  const excludeSet = alreadyLinkedPppoeSet || new Set();
  const q = (query || "").trim();
  if (!q) return { status: "empty", notice: "Masukkan PPoE Secret.", results: [] };
  const normalized = (v) => String(v || "").trim().toLowerCase();
  const matchesExact = (svc) => normalized(svc.pppoe) === normalized(q);
  const alreadyRegistered = allServices.some(svc => excludeSet.has(svc.pppoe) && matchesExact(svc));
  if (alreadyRegistered) return { status: "already", notice: "PPoE Secret sudah terdaftar.", results: [] };
  const results = allServices.filter(svc => !excludeSet.has(svc.pppoe) && matchesExact(svc));
  return results.length ? { status: "found", notice: "", results } : { status: "not_found", notice: "PPoE Secret tidak ditemukan.", results: [] };
}

   - findPrimaryServiceForContact: pppoe tempat contact jadi primary (atau null)
   - isPrimaryInOtherService: true jika contact sudah primary di service lain
   - validatePrimaryRules: pastikan tiap service max 1 primary & tiap
     contact max 1 primary lintas service. Return string error atau null.
   ============================================================ */
function findPrimaryServiceForContact(contactId, allServiceContacts, excludePppoe) {
  if (!contactId || !Array.isArray(allServiceContacts)) return null;
  const found = allServiceContacts.find(sc => sc.contactId === contactId && sc.primary && sc.pppoe !== excludePppoe);
  return found ? found.pppoe : null;
}
function isPrimaryInOtherService(contactId, targetPppoe, allServiceContacts) {
  return !!findPrimaryServiceForContact(contactId, allServiceContacts, targetPppoe);
}
function validatePrimaryRules(nextLinks) {
  if (!Array.isArray(nextLinks)) return null;
  const byService = {};
  const byContact = {};
  for (const sc of nextLinks) {
    if (sc && sc.primary) {
      byService[sc.pppoe] = (byService[sc.pppoe] || 0) + 1;
      byContact[sc.contactId] = (byContact[sc.contactId] || 0) + 1;
    }
  }
  const dupSvc = Object.keys(byService).find(k => byService[k] > 1);
  if (dupSvc) return "Service " + dupSvc + " memiliki lebih dari satu Primary Contact.";
  const dupContact = Object.keys(byContact).find(k => byContact[k] > 1);
  if (dupContact) return "Nomor ini sudah menjadi Primary di layanan " + findPrimaryServiceForContact(dupContact, nextLinks, null) + ". Satu nomor primary hanya bisa digunakan di satu layanan.";
  return null;
}

function ChatModule({ state, actions }) {
  const { chats, contacts, users, services, serviceContacts, tags, templates, selectedChatId, filter, labelFilter, profileOpen, selectionMode, selectedChatIds } = state;

  const getContact = (id) => contacts.find((c) => c.contactId === id);
  const getUser = (id) => users.find((u) => u.userId === id);
  const getService = (pppoe) => services.find((s) => s.pppoe === pppoe);
  const servicesForContact = (contactId) => serviceContacts.filter((sc) => sc.contactId === contactId);

  const chatDisplayName = (chat) => {
    if (chat.contactId) {
      const c = getContact(chat.contactId);
      return c ? c.nama : chat.nomorHp;
    }
    return chat.nomorHp;
  };

  const [chatSearch, setChatSearch] = useState("");
  const activeFilters = Array.isArray(filter) ? filter : [filter || "semua"];
  const filteredChats = useMemo(() => {
    const q = chatSearch.trim().toLowerCase();
    return chats.filter((c) => {
      if (activeFilters.includes("unread") && !(c.unread > 0)) return false;
      if (activeFilters.includes("kiosnet") && c.brand !== "KiosNet") return false;
      if (activeFilters.includes("griyanet") && c.brand !== "GriyaNet") return false;
      if (labelFilter && !c.tagIds.includes(labelFilter)) return false;
      if (q) {
        const contact = c.contactId ? getContact(c.contactId) : null;
        const haystack = [
          c.nomorHp, c.phone, c.message, c.lastMessage,
          contact?.nama, contact?.nomorHp,
          ...(c.messages || []).flatMap(m => [m.text, m.content])
        ].filter(Boolean).join(" ").toLowerCase();
        if (!haystack.includes(q)) return false;
      }
      return true;
    }).sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
  }, [chats, activeFilters.join("|"), labelFilter, chatSearch, contacts]);

  const [contextMenu, setContextMenu] = useState(null);

        </div>

{addTagChatId && (()=>{const ac=chats.find(c=>c.id===addTagChatId);const selectedIds=tagSelectorSelection;const visibleTags=tags.filter(t=>!tagSelectorSearch||t.nama.toLowerCase().includes(tagSelectorSearch.toLowerCase()));return <Modal title="Tambahkan Label" onClose={()=>{setAddTagChatId(null);setTagSelectorSearch("")}}>

          onToggleProfile={() => actions.setProfileOpen(!profileOpen)}

      {/* DRAWER: CONTACT PROFILE / MATCH PANEL */}

        <ContactProfileDrawer

  );
}


function LabelFilterSelect({ tags, value, onChange }) {

  useEffect(() => {
    const close = () => setOpen(false);
    window.addEventListener("click", close);
    return () => window.removeEventListener("click", close);
  }, []);
  const selected = tags.find(t => t.id === value);
  return (
    <div style={{position:"relative"}} onClick={e=>e.stopPropagation()}>
      <button onClick={()=>setOpen(v=>!v)} style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",gap:7,border:`1px solid ${C.border}`,borderRadius:8,padding:"6px 9px",background:C.bgPanel,color:C.textSoft,fontSize:12.5,cursor:"pointer"}}>
        <span style={{display:"flex",alignItems:"center",gap:7}}>

  return (
    <div className="flex-1 flex flex-col min-w-0" style={{ background: C.chatBg }}>
      <div className="flex items-center justify-between px-4 py-3" style={{ background: C.bgPanel, borderBottom: `1px solid ${C.border}` }}>
        <div className="flex items-center gap-3 min-w-0 cursor-pointer" onClick={onToggleProfile}>

            <div style={{display:"flex",alignItems:"center",gap:8,minWidth:0,flexWrap:"nowrap",overflow:"hidden"}}>
              <div style={{fontSize:13.5,fontWeight:600,color:C.text,fontFamily:isKnown?undefined:"monospace"}}>{displayName}</div>
              <div style={{display:"flex",alignItems:"center",gap:5,overflow:"hidden"}}>{chatTags.map(t=><Badge key={t.id} bg={C.bgPanelAlt} fg={t.color} border={t.color}>{t.nama}</Badge>)}</div>

        {chat.messages.map((m,i)=><div key={i} style={{display:"flex",justifyContent:m.from==="cc"?"flex-end":"flex-start"}}><div style={{maxWidth:"62%",padding:"8px 12px",borderRadius:10,fontSize:13,lineHeight:1.45,background:m.from==="cc"?C.accentSoft:C.bgPanelAlt,border:`1px solid ${m.from==="cc"?C.accentSoftBorder:C.border}`,color:C.text}}>{m.text}<div style={{fontSize:10,color:C.textFaint,marginTop:4,textAlign:"right"}}>{m.time}</div></div></div>)}
      </div>
      <div className="px-4 py-3" style={{background:C.bgPanel,borderTop:`1px solid ${C.border}`}}>
        <div className="flex items-center gap-2">
          <div style={{position:"relative",flexShrink:0}}>
            <button onClick={()=>setTemplateOpen(v=>!v)} style={{border:`1px solid ${C.border}`,background:C.bgPanelAlt,color:C.textSoft,borderRadius:8,padding:"8px 10px",fontSize:11.5,fontWeight:700,cursor:"pointer"}}>Template Chat</button>
            {templateOpen && <div style={{position:"absolute",left:0,bottom:"calc(100% + 6px)",width:280,maxHeight:280,overflowY:"auto",background:C.bgPanel,border:`1px solid ${C.border}`,borderRadius:9,boxShadow:"0 10px 24px rgba(0,0,0,.16)",padding:5,zIndex:80}}>
              {activeTemplates.map(t=><button key={t.id} onClick={()=>{setMessage(t.isi);setTemplateOpen(false)}} style={{display:"block",width:"100%",textAlign:"left",padding:"8px 9px",border:"none",borderRadius:7,background:"transparent",color:C.text,cursor:"pointer"}}><div style={{fontSize:12,fontWeight:700}}>{t.nama}</div><div style={{fontSize:11,color:C.textFaint,marginTop:2,lineHeight:1.35}}>{t.isi}</div></button>)}

function KnownContactBody({ contact, getUser, getService, servicesForContact, openUserDetail, openServiceDetail, actions }) {
  const links = servicesForContact(contact.contactId);
  const ownerUserIds = [...new Set(links.map((l) => getService(l.pppoe)?.userId).filter(Boolean))];
  const [matchOpen, setMatchOpen] = useState(false);
  const [matchSearch, setMatchSearch] = useState("");
  const [matchExecuted, setMatchExecuted] = useState(false);
  const [candidate, setCandidate] = useState(null);
  const [hubungan, setHubungan] = useState("");
  const [matchNotice, setMatchNotice] = useState("");
  const [matchFeedback, setMatchFeedback] = useState(null);

  const relatedPppoe = new Set(links.map(l => l.pppoe));
  const allServices = actions.getServices ? actions.getServices() : [];
  const allServiceContacts = actions.getServiceContacts ? actions.getServiceContacts() : links;
  const myPrimaryPppoe = (allServiceContacts.filter(sc => sc.contactId === contact.contactId && sc.primary)[0] || {}).pppoe || null;
  const allServicesForStatus = () => allServices;
  const searchPool = matchExecuted && matchSearch.trim()
    ? evaluateServiceMatch(matchSearch, allServices, relatedPppoe).results
    : [];

  const closeMatch = () => {
    setMatchOpen(false); setMatchSearch(""); setMatchExecuted(false); setCandidate(null); setHubungan(""); setMatchNotice("");
  };
  const confirmMatch = () => {
    if (!candidate || !hubungan) { setMatchFeedback({type:"error",message:"Konfirmasi gagal, data belum lengkap."}); return; }
    // Fitur "jadikan primary" dihapus dari card: link baru selalu Non-Primary
    // (kecuali service belum punya primary → otomatis jadi Primary via action).
    const ok = actions.confirmExistingServiceMatch(contact.contactId, candidate.pppoe, hubungan, false);
    if (!ok) {
      setMatchFeedback({type:"error",message:"Gagal menghubungkan service. Service sudah memiliki Primary Contact."});
      return;
    }
    closeMatch();
    setMatchFeedback({type:"success",message:"Service berhasil dihubungkan ke Contact ini."});
  };

  return (
    <>
      <button onClick={() => { setMatchOpen(true); setMatchSearch(""); setMatchExecuted(false); setCandidate(null); setHubungan(""); }}
        className="mb-3 w-full py-2 rounded-md text-sm font-semibold flex items-center justify-center gap-1.5"
        style={{background:C.accentSoft,color:C.accent,border:`1px solid ${C.accentSoftBorder}`,cursor:"pointer"}}>
        <Search size={14}/> Cocokkan Layanan
      </button>

      <div style={{ fontSize: 12.5, fontWeight: 700, color: C.textSoft, textTransform: "uppercase", letterSpacing: 0.4, marginBottom: 8, marginTop: 2 }}>
        User{ownerUserIds.length > 1 ? ` (${ownerUserIds.length})` : ""}
      </div>
      <div className="flex flex-col gap-2.5" style={{marginBottom:14}}>
        {ownerUserIds.map((uid) => {
          const u = getUser(uid);
          if (!u) return null;
          const userStatus = deriveUserStatus(u.userId, allServices);
          return (
            <div key={uid} style={{ border:`1px solid ${C.border}`, borderRadius:8, padding:"8px 10px", background:C.bgPanel }}>
              <div className="flex items-start justify-between gap-2">
                <div style={{minWidth:0, fontSize: 13, fontWeight: 700, color: C.text }}>{u.nama}</div>
                <div style={{flexShrink:0}}><StatusDot status={userStatus} /></div>
              </div>
              <div style={{ fontSize: 11, color: C.textFaint, marginTop: 2 }}>{u.userId} • NIK {maskNik(u.nik)}</div>
              <button onClick={() => openUserDetail(u.userId)} className="mt-1.5 w-full py-1 rounded-md text-sm font-semibold" style={{ background: C.accentSoft, color: C.accent, border: `1px solid ${C.accentSoftBorder}`, cursor: "pointer" }}>Detail</button>
            </div>
          );
        })}
      </div>

      <div style={{ fontSize: 12.5, fontWeight: 700, color: C.textSoft, textTransform: "uppercase", letterSpacing: 0.4, marginBottom: 8, marginTop: 4 }}>
        Service ({links.length}){myPrimaryPppoe ? ` • Primary di ${myPrimaryPppoe}` : ""}
      </div>
      {links.length === 0 && <p style={{ fontSize: 12.5, color: C.textFaint }}>Belum ada Service yang terhubung ke Contact ini.</p>}
      <div className="flex flex-col gap-2.5">
        {links.map((l) => {
          const svc = getService(l.pppoe);
          if (!svc) return null;
          const sc = statusColor(svc.status);
          return (
            <div key={l.id} style={{ border: `1px solid ${C.border}`, borderRadius: 8, padding: 9 }}>
              <div className="flex items-center justify-between">
                <span style={{ fontSize: 13.5, fontWeight: 700, color: C.text }}>{svc.pppoe}</span>
                <Badge bg={sc.bg} fg={sc.fg}>{sc.label}</Badge>
              </div>
              <div style={{ fontSize: 12, color: C.textFaint, marginTop: 2 }}>{svc.paket} • {svc.branch}</div>
              <div className="flex items-center gap-2 mt-2">
                <Badge bg={C.bgPanelAlt} fg={C.textSoft} border={C.border}>Hubungan: {l.hubungan}</Badge>
                {l.primary ? <Badge bg={C.successSoft} fg={C.success}>Primary</Badge> : <Badge bg={C.bgPanelAlt} fg={C.textFaint} border={C.border}>Non Primary</Badge>}
              </div>
              <button onClick={() => openServiceDetail(svc.pppoe)} className="mt-2.5 w-full py-1.5 rounded-md text-sm font-semibold" style={{ background: C.bgPanel, color: C.accent, border: `1px solid ${C.accentSoftBorder}`, cursor: "pointer" }}>Detail Service</button>
            </div>
          );
        })}
      </div>

      {matchOpen && (
        <Modal title="Cocokkan Layanan" onClose={closeMatch}>
          <div style={{display:"flex",alignItems:"center",gap:7,border:`1px solid ${C.border}`,borderRadius:8,padding:"7px 9px",background:C.bgPanelAlt,marginBottom:8}}>
            <Search size={14} color={C.textFaint}/>
            <input autoFocus value={matchSearch} onChange={e=>{setMatchSearch(e.target.value);setMatchExecuted(false);setCandidate(null);setMatchNotice("");}} placeholder="PPoE Secret..." style={{border:"none",outline:"none",background:"transparent",color:C.text,width:"100%",fontSize:12.5}}/>
          </div>
          <button onClick={()=>{
              setCandidate(null); setHubungan("");
              const evalResult = evaluateServiceMatch(matchSearch, allServices, relatedPppoe);
              if (evalResult.status === "empty" || evalResult.status === "already") {
                setMatchExecuted(false); setMatchNotice(evalResult.notice); return;
              }
              setMatchNotice(""); setMatchExecuted(true);
            }}
            style={{width:"100%",background:C.accent,color:"#fff",border:"none",borderRadius:8,padding:"8px 0",fontSize:12.5,fontWeight:600,cursor:"pointer",marginBottom:10}}>
            Cari Layanan
          </button>

          {matchNotice && <div style={{background:C.warningSoft,border:`1px solid ${C.warningSoftBorder || C.border}`,color:C.warning,padding:"8px 9px",borderRadius:8,fontSize:12,marginBottom:8}}>⚠ {matchNotice}</div>}
          {!matchExecuted && !matchNotice && <div style={{fontSize:12,color:C.textFaint,textAlign:"center",padding:"10px 4px"}}>Masukkan PPoE Secret atau alamat, lalu klik Cari Layanan.</div>}
          {matchExecuted && !candidate && (
            <div className="flex flex-col gap-1.5" style={{maxHeight:250,overflowY:"auto"}}>
              {searchPool.map(svc => {
                const owner = getUser(svc.userId);
                return <button key={svc.pppoe} onClick={()=>setCandidate(svc)}
                  style={{textAlign:"left",padding:9,border:`1px solid ${C.border}`,borderRadius:8,background:C.bgPanel,color:C.text,cursor:"pointer"}}>
                  <div style={{fontSize:12.5,fontWeight:700}}>{svc.pppoe}</div>
                  <div style={{fontSize:11.5,color:C.textFaint}}>{owner?.nama || "-"} • {svc.alamat || "-"} • {svc.status}</div>
                  <div style={{marginTop:5,fontSize:11.5,color:C.accent,fontWeight:600}}>Pilih Layanan</div>
                </button>;
              })}
              {!searchPool.length && <div style={{fontSize:12,color:C.warning,padding:10,textAlign:"center"}}>⚠ PPoE Secret tidak ditemukan</div>}
            </div>
          )}
          {candidate && (
            <SectionCard title="Kandidat Service">
              <div style={{fontSize:13.5,fontWeight:700,color:C.text}}>{candidate.pppoe}</div>
              <div style={{fontSize:12,color:C.textFaint,marginTop:2}}>{candidate.status} • {candidate.paket} • {candidate.branch}</div>
              <div style={{fontSize:12,color:C.textSoft,marginTop:5}}>User: <b>{getUser(candidate.userId)?.nama || "-"}</b> ({candidate.userId})</div>
              <div style={{fontSize:12,color:C.textSoft,marginTop:2}}>Alamat: {candidate.alamat || "-"}</div>
              <SectionCard title="Konfirmasi Data Contact">
                <div className="flex flex-col gap-2.5">
                  <InfoRow label="Nomor HP" value={contact.nomorHp}/>
                  <InfoRow label="Nama" value={contact.nama}/>
                  <div>
                    <label style={{fontSize:11,color:C.textFaint,fontWeight:600}}>Hubungan dengan pemilik layanan</label>
                    <select value={hubungan} onChange={e=>setHubungan(e.target.value)} style={{width:"100%",marginTop:3,fontSize:12.5,border:`1px solid ${C.border}`,borderRadius:7,padding:"7px 8px",background:C.bgPanel,color:C.text}}>
                      <option value="">Pilih hubungan</option>
                      {["Pemilik","Keluarga","Pasangan","Anak","Orang Tua","PIC","Karyawan","Lainnya"].map(x=><option key={x}>{x}</option>)}
                    </select>
                  </div>
                  <div style={{fontSize:11,color:C.textFaint,lineHeight:1.45}}>Nomor baru akan ditambahkan sebagai Non-Primary.</div>
                </div>
                <div className="flex justify-end gap-2 mt-3">
                  <button onClick={()=>{setCandidate(null);setHubungan("");}} style={{padding:"7px 12px",border:`1px solid ${C.border}`,borderRadius:7,background:C.bgPanel,color:C.textSoft,cursor:"pointer"}}>Batal</button>
                  <button disabled={!hubungan} onClick={()=>{confirmMatch();}} style={{padding:"7px 12px",border:"none",borderRadius:7,background:hubungan?C.accent:"#aeb7c5",color:"#fff",cursor:hubungan?"pointer":"not-allowed"}}>Konfirmasi</button>
                </div>
              </SectionCard>
            </SectionCard>
          )}
        </Modal>
      )}
      {matchFeedback && <CR12Toast message={matchFeedback.message} type={matchFeedback.type} onClose={()=>setMatchFeedback(null)}/>}
    </>
  );
}

function MatchPanel({ chat, getUser, getService, actions }) {
  const [search, setSearch] = useState("");
  const [searched, setSearched] = useState(false);
  const [selected, setSelected] = useState(null);
  const [notice, setNotice] = useState("");
  const allServices = actions.getServices ? actions.getServices() : [];
  const results = searched && search.trim() ? evaluateServiceMatch(search, allServices, new Set()).results : [];

  if (chat.matchStep === "acc") {
    return <div style={{ background: C.successSoft, border: `1px solid #b9e6cb`, borderRadius: 8, padding: 9, textAlign: "center" }}>
      <Check size={18} color={C.success} style={{ margin: "0 auto 6px" }} />
      <p style={{ fontSize: 12.5, color: C.success, fontWeight: 600 }}>Contact berhasil dibuat &amp; disimpan.</p>
    </div>;
  }

  const selectedService = selected || (chat.matchStep === "matched" ? getService(chat.candidatePppoe) : null);
  const owner = selectedService ? getUser(selectedService.userId) : null;

  return (
    <div>
      {!selectedService && (
        <SectionCard title="Cocokkan Layanan">
          <p style={{fontSize:11.5,color:C.textFaint,lineHeight:1.5,marginBottom:9}}>Masukkan PPoE Secret untuk mencari kandidat Service.</p>
          <div style={{display:"flex",alignItems:"center",gap:7,border:`1px solid ${C.border}`,borderRadius:8,padding:"7px 9px",background:C.bgPanelAlt,marginBottom:8}}>
            <Search size={14} color={C.textFaint}/>
            <input value={search} onChange={e=>{setSearch(e.target.value);setSearched(false);setSelected(null);setNotice("")}} placeholder="PPoE Secret..." style={{border:"none",outline:"none",background:"transparent",color:C.text,width:"100%",fontSize:12.5}}/>
          </div>
          <button onClick={()=>{
              setSelected(null);
              const evalResult = evaluateServiceMatch(search, allServices, new Set());
              if (evalResult.status === "empty") { setSearched(false); setNotice(evalResult.notice); return; }
              setNotice(""); setSearched(true);
            }} style={{width:"100%",background:C.accent,color:"#fff",border:"none",borderRadius:8,padding:"8px 0",fontSize:12.5,fontWeight:600,cursor:"pointer"}}>Cari Layanan</button>
          {notice && <div style={{background:C.warningSoft,border:`1px solid ${C.warningSoftBorder || C.border}`,color:C.warning,padding:"8px 9px",borderRadius:8,fontSize:12,marginTop:8}}>⚠ {notice}</div>}
          {!searched && !notice && <div style={{fontSize:11.5,color:C.textFaint,textAlign:"center",padding:"10px 2px 2px"}}>Hasil layanan akan muncul setelah pencarian dikonfirmasi.</div>}
          {searched && !results.length && <div style={{fontSize:12,color:C.warning,textAlign:"center",padding:"12px 2px 2px"}}>⚠ PPoE Secret tidak ditemukan</div>}
          {searched && results.length > 0 && <div className="flex flex-col gap-1.5" style={{marginTop:10,maxHeight:220,overflowY:"auto"}}>
            {results.map(svc=>{
              const owner=getUser(svc.userId);
              return <button key={svc.pppoe} onClick={()=>{setSelected(svc);setNotice("");actions.selectUnknownService(chat.id,svc.pppoe);}}
                style={{textAlign:"left",padding:9,border:`1px solid ${C.border}`,borderRadius:8,background:C.bgPanel,color:C.text,cursor:"pointer"}}>
                <div style={{fontSize:12.5,fontWeight:700}}>{svc.pppoe}</div>
                <div style={{fontSize:11.5,color:C.textFaint}}>{owner?.nama || "-"} • {svc.alamat || "-"} • {svc.status}</div>
                <div style={{marginTop:5,fontSize:11.5,color:C.accent,fontWeight:600}}>Pilih Layanan</div>
              </button>;
            })}
          </div>}
        </SectionCard>
      )}

      {selectedService && (
        <>
          <div style={{background:C.warningSoft,border:`1px solid #f0dcb4`,borderRadius:10,padding:12,marginBottom:12}}>
            <div className="flex items-center gap-2 mb-1"><Info size={14} color={C.warning}/><span style={{fontSize:12.5,fontWeight:700,color:C.warning}}>Kandidat Match — Belum Jadi Contact</span></div>
            <p style={{fontSize:12,color:"#7a5416",lineHeight:1.5}}>Match hanya menghasilkan kandidat. Contact resmi baru dibuat setelah Customer Care mengonfirmasi data.</p>
          </div>
          <SectionCard title="Kandidat Service">
            <div style={{fontSize:13.5,fontWeight:700,color:C.text}}>{selectedService.pppoe}</div>
            <div style={{fontSize:12,color:C.textFaint,marginTop:2}}>{selectedService.status} • {selectedService.paket} • {selectedService.branch}</div>
            <div style={{fontSize:12,color:C.textSoft,marginTop:6}}>Nama User: <b>{owner?.nama || "-"}</b></div>
            <div style={{fontSize:12,color:C.textSoft,marginTop:2}}>Alamat: {selectedService.alamat || "-"}</div>
          </SectionCard>
          {chat.matchStep === "matched" && (
            <button onClick={()=>actions.matchAskRelation(chat.id)} style={{width:"100%",background:C.accent,color:"#fff",border:"none",borderRadius:8,padding:"9px 0",fontSize:13,fontWeight:600,cursor:"pointer"}}>
              Tanyakan Hubungan ke Customer
            </button>
          )}
          {chat.matchStep === "asked" && <div style={{textAlign:"center",padding:"14px 0"}}>
            <p style={{fontSize:12.5,color:C.textFaint,marginBottom:10}}>Menunggu balasan customer mengenai hubungannya dengan pemilik layanan...</p>
            <button onClick={()=>actions.matchSimulateReply(chat.id)} style={{width:"100%",background:C.bgPanel,color:C.accent,border:`1px solid ${C.accentSoftBorder}`,borderRadius:8,padding:"9px 0",fontSize:13,fontWeight:600,cursor:"pointer"}}>(Simulasi) Customer Membalas</button>
          </div>}
          {chat.matchStep === "replied" && <ConfirmContactForm chat={chat} actions={actions} />}
        </>
      )}
    </div>
  );
}

function ConfirmContactForm({ chat, actions }) {
  const [nama, setNama] = useState(chat.candidateNama || "");
  const [hubungan, setHubungan] = useState(chat.candidateHubungan || "");
  const [accError, setAccError] = useState("");
  const relationshipOptions = ["Pemilik","Keluarga","Pasangan","Anak","Orang Tua","PIC","Karyawan","Lainnya"];

  const doAcc = () => {
    // Fitur "jadikan primary" dihapus dari card: contact baru selalu Non-Primary
    // (kecuali service belum punya primary → otomatis jadi Primary via action).
    const ok = actions.matchConfirmAcc(chat.id, { nama:nama.trim(), hubungan, primary: false });
    if (!ok) {
      setAccError("Gagal membuat contact. Service sudah memiliki Primary Contact.");
      return;
    }
    setAccError("");
  };

  return (
    <SectionCard title="Konfirmasi Data Contact">
      <p style={{ fontSize: 11.5, color: C.textFaint, marginBottom: 10, lineHeight: 1.5 }}>
        Customer sudah membalas hubungannya. Lengkapi &amp; setujui data berikut sebelum Contact resmi dibuat.
      </p>
      <div className="flex flex-col gap-2.5">
        <div>
          <label style={{ fontSize: 11, color: C.textFaint, fontWeight: 600 }}>Nomor HP</label>
          <div style={{ fontSize: 13, fontWeight: 600, color: C.text, fontFamily: "monospace" }}>{chat.nomorHp}</div>
        </div>
        <div>
          <label style={{ fontSize: 11, color: C.textFaint, fontWeight: 600 }}>Nama</label>
          <input value={nama} onChange={(e) => setNama(e.target.value)} placeholder="Nama customer..." style={{ width: "100%", border: `1px solid ${C.border}`, borderRadius: 8, padding: "7px 10px", fontSize: 12.5, marginTop: 2, background:C.bgPanel, color:C.text }} />
        </div>
        <div>
          <label style={{ fontSize: 11, color: C.textFaint, fontWeight: 600 }}>Hubungan dengan pemilik layanan</label>
          <select value={hubungan} onChange={(e) => setHubungan(e.target.value)} style={{ width:"100%", marginTop:3, fontSize:12.5, border:`1px solid ${C.border}`, borderRadius:7, padding:"7px 8px", background:C.bgPanel, color:C.text }}>
            <option value="">Pilih hubungan</option>
            {relationshipOptions.map(x => <option key={x} value={x}>{x}</option>)}
          </select>
        </div>
        <div style={{fontSize:11,color:C.textFaint,lineHeight:1.45}}>Nomor baru akan ditambahkan sebagai Non-Primary.</div>
      </div>
      {accError && <div style={{marginTop:8,background:C.dangerSoft,border:`1px solid ${C.danger}`,color:C.danger,padding:"8px 9px",borderRadius:8,fontSize:11.5,lineHeight:1.45}}>{accError}</div>}
      <button
        disabled={!nama.trim() || !hubungan}
        onClick={() => {
          setAccError("");
          doAcc();
        }}
        className="mt-3 w-full py-2 rounded-md text-sm font-semibold"
        style={{
          background: !nama.trim() || !hubungan ? "#c7cedb" : C.success, color: "#fff", border: "none",
          cursor: !nama.trim() || !hubungan ? "not-allowed" : "pointer",
        }}
      >
        Konfirmasi (ACC) &amp; Buat Contact
      </button>
    </SectionCard>
  );
}

function TagModule({ tags, setTags }) {
  const [modal, setModal] = useState(null); // {mode:'add'|'edit', id, name, color}
  const [deleteId, setDeleteId] = useState(null);

  const openAdd = () => setModal({ mode: "add", name: "", color: "#3b6fe6" });
  const openEdit = (t) => setModal({ mode: "edit", id: t.id, name: t.nama, color: t.color });

  const save = () => {
    if (!modal.name.trim()) return;
    if (modal.mode === "add") {
      setTags([...tags, { id: "T" + Date.now(), nama: modal.name.trim(), color: modal.color }]);
    } else {
      setTags(tags.map((t) => (t.id === modal.id ? { ...t, nama: modal.name.trim(), color: modal.color } : t)));
    }
    setModal(null);
  };

  const confirmDelete = () => {
    setTags(tags.filter((t) => t.id !== deleteId));
    setDeleteId(null);
  };

  return (
    <div className="flex-1 flex flex-col min-w-0" style={{ background: C.bgApp }}>
      <ListPageHeader
        icon={<TagIcon size={17} color={C.accent} />}
        title="Tag"
        subtitle="Kelola label operasional untuk Chat Customer Care"
        action={
          <button onClick={openAdd} className="flex items-center gap-1.5 px-3 py-2 rounded-md text-sm font-semibold" style={{ background: C.accent, color: "#fff", border: "none", cursor: "pointer" }}>
            <Plus size={15} /> Tambah Tag
          </button>
        }
      />
      <div className="p-6" style={{ maxWidth: 640 }}>
        {tags.length === 0 && (
          <div className="text-center py-16" style={{ color: C.textFaint, fontSize: 13 }}>
            Belum ada Tag. Klik "Tambah Tag" untuk membuat yang pertama.
          </div>
        )}
        <div className="flex flex-col gap-2">
          {tags.map((t) => (
            <div key={t.id} className="flex items-center justify-between px-4 py-3" style={{ background: C.bgPanel, border: `1px solid ${C.border}`, borderRadius: 10 }}>
              <div className="flex items-center gap-2.5">
                <span style={{ width: 10, height: 10, borderRadius: "50%", background: t.color, display: "inline-block" }} />
                <span style={{ fontSize: 13.5, fontWeight: 600, color: C.text }}>{t.nama}</span>
              </div>
              <div className="flex items-center gap-1">
                <button onClick={() => openEdit(t)} style={{ border: "none", background: "transparent", cursor: "pointer", padding: 6 }}>
                  <Pencil size={15} color={C.textFaint} />
                </button>
                <button onClick={() => setDeleteId(t.id)} style={{ border: "none", background: "transparent", cursor: "pointer", padding: 6 }}>
                  <Trash2 size={15} color={C.danger} />
                </button>
              </div>
            </div>
          ))}
        </div>
      </div>

      {modal && (
        <Modal onClose={() => setModal(null)} title={modal.mode === "add" ? "Tambah Tag" : "Edit Tag"}>
          <label style={{ fontSize: 12, fontWeight: 600, color: C.textSoft }}>Nama Tag</label>
          <input
            autoFocus value={modal.name} onChange={(e) => setModal({ ...modal, name: e.target.value })}
            style={{ width: "100%", border: `1px solid ${C.border}`, borderRadius: 8, padding: "8px 10px", fontSize: 13, margin: "6px 0 14px" }}
          />
          <label style={{ fontSize: 12, fontWeight: 600, color: C.textSoft }}>Warna</label>
          <div className="flex items-center gap-2 mb-5"><input type="color" value={modal.color} onChange={e=>setModal({...modal,color:e.target.value})} style={{width:42,height:34,padding:2,border:`1px solid ${C.border}`,borderRadius:7,background:C.bgPanel}}/><span style={{fontSize:11.5,color:C.textFaint}}>Pilih warna bebas</span><span style={{fontSize:11.5,color:C.textSoft,fontFamily:"monospace"}}>{modal.color}</span></div>
          <div className="flex justify-end gap-2">
            <button onClick={() => setModal(null)} style={{ padding: "8px 14px", borderRadius: 8, border: `1px solid ${C.border}`, background: C.bgPanel, fontSize: 13, cursor: "pointer" }}>Batal</button>
            <button onClick={save} style={{ padding: "8px 14px", borderRadius: 8, border: "none", background: C.accent, color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Simpan</button>
          </div>
        </Modal>
      )}

      {deleteId && (
        <Modal onClose={() => setDeleteId(null)} title="Hapus Tag">
          <p style={{ fontSize: 13, color: C.textSoft, marginBottom: 18 }}>
            Yakin ingin menghapus tag <b>{tags.find((t) => t.id === deleteId)?.nama}</b>? Tindakan ini tidak dapat dibatalkan.
          </p>
          <div className="flex justify-end gap-2">
            <button onClick={() => setDeleteId(null)} style={{ padding: "8px 14px", borderRadius: 8, border: `1px solid ${C.border}`, background: C.bgPanel, fontSize: 13, cursor: "pointer" }}>Batal</button>
            <button onClick={confirmDelete} style={{ padding: "8px 14px", borderRadius: 8, border: "none", background: C.danger, color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Hapus</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function Modal({ title, children, onClose, width = 340 }) {
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(20,24,32,0.4)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50, padding: 16 }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} style={{ background: C.bgPanel, borderRadius: 12, padding: 20, width: `min(${width}px, calc(100vw - 32px))`, maxHeight: "calc(100vh - 32px)", overflowY: "auto", boxShadow: "0 12px 32px rgba(0,0,0,0.18)" }}>
        <div className="flex items-center justify-between mb-4">
          <h3 style={{ fontSize: 14.5, fontWeight: 700, color: C.text }}>{title}</h3>
          <button onClick={onClose} style={{ border: "none", background: "transparent", cursor: "pointer" }}><X size={16} color={C.textFaint} /></button>
        </div>
        {children}
      </div>
    </div>
  );
}

function FilterSelect({ label, value, options, onChange }) {
  const [open, setOpen] = useState(false);
  useEffect(() => {
    const close = () => setOpen(false);
    window.addEventListener("click", close);
    return () => window.removeEventListener("click", close);
  }, []);
  const display = value ? `${label}: ${value}` : label;
  return (
    <div className="cc-filter-menu" onClick={e => e.stopPropagation()}>
      <button className="cc-filter-button" onClick={() => setOpen(v => !v)}>{display}<ChevronDown size={13} color={C.textFaint}/></button>
      {open && <div style={{position:"absolute",top:"calc(100% + 4px)",right:0,minWidth:150,maxHeight:220,overflowY:"auto",background:C.bgPanel,border:`1px solid ${C.border}`,borderRadius:8,boxShadow:"0 10px 24px rgba(0,0,0,.14)",padding:4,zIndex:30}}>
        {options.map(opt => <button key={opt.value} className="cc-filter-option" style={{background:value===opt.value?C.accentSoft:"transparent",fontWeight:value===opt.value?700:500}} onClick={() => {onChange(opt.value);setOpen(false);}}>{opt.label}</button>)}
      </div>}
    </div>
  );
}

function TemplateChatModule({ templates, actions }) {
  const [search,setSearch]=useState("");
  const [statusFilter,setStatusFilter]=useState("");
  const [modal,setModal]=useState(null);
  const [deleteId,setDeleteId]=useState(null);
  const rows=(templates||[]).filter(t=>!statusFilter||t.status===statusFilter).filter(t=>{
    const q=search.toLowerCase();
    return !q || t.nama.toLowerCase().includes(q) || t.isi.toLowerCase().includes(q);
  });
  const save=()=>{
    if(!modal?.nama?.trim() || !modal?.isi?.trim()) return;
    if(modal.mode==="add") actions.createTemplate({id:"TPL"+Date.now(),nama:modal.nama.trim(),isi:modal.isi.trim(),status:modal.status});
    else actions.updateTemplate(modal.id,{nama:modal.nama.trim(),isi:modal.isi.trim(),status:modal.status});
    setModal(null);
  };
  return <div className="flex-1 flex flex-col min-w-0" style={{background:C.bgApp,overflowY:"auto"}}>
    <ListPageHeader icon={<MessageCircle size={17} color={C.accent}/>} title="Template Chat" subtitle={`${templates.length} template terdaftar`} action={<button onClick={()=>setModal({mode:"add",nama:"",isi:"",status:"Active"})} className="flex items-center gap-1.5 px-3 py-2 rounded-md text-sm font-semibold" style={{background:C.accent,color:"#fff",border:"none",cursor:"pointer"}}><Plus size={15}/> Tambah Template</button>}/>
    <div className="px-6 pt-4 flex gap-2">
      <div style={{display:"flex",alignItems:"center",gap:7,flex:1,border:`1px solid ${C.border}`,borderRadius:8,padding:"7px 10px",background:C.bgPanel}}><Search size={14} color={C.textFaint}/><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Cari nama atau isi template" style={{border:"none",outline:"none",background:"transparent",color:C.text,width:"100%",fontSize:12.5}}/></div>
      <FilterSelect label="Status" value={statusFilter} onChange={setStatusFilter} options={[{value:"",label:"All"},{value:"Active",label:"Active"},{value:"Non Active",label:"Non Active"}]}/>
    </div>
    <div className="p-6"><DataTable columns={[
      {key:"nama",label:"Nama Template"},
      {key:"isi",label:"Isi Template"},
      {key:"status",label:"Status",render:r=><StatusDot status={r.status}/>},
      {key:"action",label:"Action",render:r=><div className="flex gap-1.5"><button onClick={e=>{e.stopPropagation();setModal({mode:"edit",...r})}} style={{padding:"4px 8px",border:`1px solid ${C.border}`,borderRadius:6,background:C.bgPanel,color:C.accent,fontSize:11,cursor:"pointer"}}>Edit</button><button onClick={e=>{e.stopPropagation();setDeleteId(r.id)}} style={{padding:"4px 8px",border:`1px solid ${C.danger}`,borderRadius:6,background:C.dangerSoft,color:C.danger,fontSize:11,cursor:"pointer"}}>Delete</button></div>}
    ]} rows={rows}/>
    </div>
    {modal && <Modal title={modal.mode==="add"?"Tambah Template":"Edit Template"} onClose={()=>setModal(null)}>
      <div className="flex flex-col gap-3">
        <div><label style={{fontSize:11,color:C.textFaint,fontWeight:600}}>Nama Template</label><input autoFocus value={modal.nama} onChange={e=>setModal({...modal,nama:e.target.value})} style={{width:"100%",marginTop:4,padding:"8px 9px",border:`1px solid ${C.border}`,borderRadius:7,background:C.bgPanel,color:C.text,fontSize:12.5}}/></div>
        <div><label style={{fontSize:11,color:C.textFaint,fontWeight:600}}>Isi Template</label><textarea value={modal.isi} onChange={e=>setModal({...modal,isi:e.target.value})} style={{width:"100%",minHeight:110,marginTop:4,padding:"8px 9px",border:`1px solid ${C.border}`,borderRadius:7,background:C.bgPanel,color:C.text,fontSize:12.5}}/></div>
        <div><label style={{fontSize:11,color:C.textFaint,fontWeight:600}}>Status</label><select value={modal.status} onChange={e=>setModal({...modal,status:e.target.value})} style={{width:"100%",marginTop:4,padding:"8px 9px",border:`1px solid ${C.border}`,borderRadius:7,background:C.bgPanel,color:C.text,fontSize:12.5}}><option>Active</option><option>Non Active</option></select></div>
        <div className="flex justify-end gap-2"><button onClick={()=>setModal(null)} style={{padding:"7px 12px",border:`1px solid ${C.border}`,borderRadius:7,background:C.bgPanel,color:C.text,cursor:"pointer"}}>Batal</button><button disabled={!modal.nama.trim()||!modal.isi.trim()} onClick={save} style={{padding:"7px 12px",border:"none",borderRadius:7,background:modal.nama.trim()&&modal.isi.trim()?C.accent:"#aeb7c5",color:"#fff",fontWeight:600,cursor:modal.nama.trim()&&modal.isi.trim()?"pointer":"not-allowed"}}>Simpan</button></div>
      </div>
    </Modal>}
    {deleteId && <Modal title="Hapus Template" onClose={()=>setDeleteId(null)}><div style={{fontSize:12.5,color:C.text,lineHeight:1.5,marginBottom:14}}>Apakah Anda yakin ingin menghapus template ini?</div><div className="flex justify-end gap-2"><button onClick={()=>setDeleteId(null)} style={{padding:"7px 12px",border:`1px solid ${C.border}`,borderRadius:7,background:C.bgPanel,color:C.text,cursor:"pointer"}}>Batal</button><button onClick={()=>{actions.deleteTemplate(deleteId);setDeleteId(null)}} style={{padding:"7px 12px",border:"none",borderRadius:7,background:C.danger,color:"#fff",fontWeight:600,cursor:"pointer"}}>Hapus</button></div></Modal>}
  </div>;
}

function UserModule({ users, services, contacts, serviceContacts, selectedUserId, openUserDetail, back, openServiceDetail }) {
  const user = users.find((u) => u.userId === selectedUserId);
  const [search,setSearch]=useState(""); const [statusFilter,setStatusFilter]=useState("");

  if (!user) {
    const rows = users.filter(u=>!search||[u.userId,u.nik,u.nama].some(v=>String(v).toLowerCase().includes(search.toLowerCase()))).filter(u=>!statusFilter||deriveUserStatus(u.userId, services)===statusFilter).map((u) => ({ ...u, status: deriveUserStatus(u.userId, services), serviceCount: services.filter((s) => s.userId === u.userId).length }));
    return (
      <div className="flex-1 flex flex-col min-w-0" style={{ background: C.bgApp }}>
        <ListPageHeader icon={<Users size={17} color={C.accent} />} title="User" subtitle={`${users.length} user terdaftar`} />
        <div className="px-6 pt-4 flex gap-2"><div style={{display:"flex",alignItems:"center",gap:7,flex:1,border:`1px solid ${C.border}`,borderRadius:8,padding:"7px 10px",background:C.bgPanel}}><Search size={14} color={C.textFaint}/><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Cari User ID, NIK, atau Nama" style={{border:"none",outline:"none",background:"transparent",color:C.text,width:"100%",fontSize:12.5}}/></div><FilterSelect label="Status" value={statusFilter} onChange={setStatusFilter} options={[{value:"",label:"All"},{value:"Active",label:"Active"},{value:"Non Active",label:"Non Active"}]}/></div>
        <div className="p-6">
          <DataTable
            columns={[
              { key: "userId", label: "User ID" },
              { key: "nik", label: "NIK", render: (r) => maskNik(r.nik) },
              { key: "nama", label: "Nama Lengkap" },
              { key: "serviceCount", label: "Jumlah Service" },
              { key: "status", label: "Status", render: (r) => <StatusDot status={r.status} /> },
            ]}
            rows={rows}
            onRowClick={(r) => openUserDetail(r.userId)}
          />
        </div>
      </div>
    );
  }

  const userServices = services.filter((s) => s.userId === user.userId);
  const contactRows = Array.from(new Map(
    userServices.flatMap(s => serviceContacts.filter(sc => sc.pppoe === s.pppoe).map(sc => contacts.find(c => c.contactId === sc.contactId)))
      .filter(Boolean).map(c => [c.nomorHp, {nomorHp:c.nomorHp, nama:c.nama || "-", status:c.status}])
  ).values());

  return (
    <div className="flex-1 flex flex-col min-w-0" style={{ background: C.bgApp, overflowY: "auto" }}>
      <DetailHeader onBack={back} title={user.nama} subtitle={user.userId} statusBadge={<StatusDot status={deriveUserStatus(user.userId, services)} />} />
      <div className="p-6" style={{ maxWidth: 780 }}>
        <SectionCard title="Overview">
          <InfoRow label="User ID" value={user.userId} />
          <InfoRow label="NIK" value={maskNik(user.nik)} />
          <InfoRow label="Nama Lengkap" value={user.nama} />
          <InfoRow label="TTL" value={user.ttl} />
          <InfoRow label="Provinsi" value={user.provinsi} />
          <InfoRow label="Kota/Kabupaten" value={user.kotaKab} />
          <InfoRow label="Kecamatan" value={user.kecamatan} />
          <InfoRow label="Kelurahan" value={user.kelurahan} />
          <InfoRow label="Alamat" value={user.alamat} />
          <InfoRow label="Status User" value={<StatusDot status={deriveUserStatus(user.userId, services)} />} />
        </SectionCard>

        <SectionCard title={`Service Cards (${userServices.length})`}>
          {userServices.length === 0 && <p style={{ fontSize: 12.5, color: C.textFaint }}>User ini belum memiliki Service.</p>}
          <div className="flex flex-col gap-2.5">
            {userServices.map((s) => {
              const sc = statusColor(s.status);
              return (
                <div key={s.pppoe} style={{ border: `1px solid ${C.border}`, borderRadius: 10, padding: 12 }}>
                  <div className="flex items-center justify-between">
                    <span style={{ fontSize: 13.5, fontWeight: 700 }}>{s.pppoe}</span>
                    <Badge bg={sc.bg} fg={sc.fg}>{sc.label}</Badge>
                  </div>
                  <div style={{ fontSize: 12, color: C.textFaint, marginTop: 2 }}>{s.paket} • Subscribe s.d. {s.subExpired}</div>
                  <button onClick={() => openServiceDetail(s.pppoe)} className="mt-2.5 py-1.5 px-3 rounded-md text-sm font-semibold" style={{ background: C.bgPanel, color: C.accent, border: `1px solid ${C.accentSoftBorder}`, cursor: "pointer" }}>
                    Detail Service
                  </button>
                </div>
              );
            })}
          </div>
        </SectionCard>

        <SectionCard title="Contact Table">
          <DataTable
            columns={[
              { key: "nomorHp", label: "Nomor HP" },
              { key: "nama", label: "Nama" },
              { key: "status", label: "Status", render:r=><StatusDot status={r.status}/> },
            ]}
            rows={contactRows}
            emptyLabel="Belum ada Contact yang terhubung."
          />
        </SectionCard>
      </div>
    </div>
  );
}

/* ============================================================
   SERVICE MODULE
   ============================================================ */
function ServiceModule({ services, users, contacts, serviceContacts, selectedPppoe, openServiceDetail, back, openUserDetail, onChangePrimary, actions }) {
  const service = services.find((s) => s.pppoe === selectedPppoe);
  const [search,setSearch]=useState("");
  const [statusFilter,setStatusFilter]=useState("");
  const [branchFilter,setBranchFilter]=useState("");
  const [paketFilter,setPaketFilter]=useState("");
  const [editServiceContact, setEditServiceContact] = useState(null);
  const [editServiceRelationship, setEditServiceRelationship] = useState("");
  const [editServicePrimary, setEditServicePrimary] = useState(false);
  const [pendingPrimary, setPendingPrimary] = useState(null);
  const [feedback, setFeedback] = useState(null);
  const [editServiceOpen, setEditServiceOpen] = useState(false);
  const [editPaket, setEditPaket] = useState(service?.paket || "10 Mbps");
  const [editDiscount, setEditDiscount] = useState(service?.discountValue || "");
  const [editDiscountType, setEditDiscountType] = useState(service?.discountType || "Permanent");
  const [terminationOpen, setTerminationOpen] = useState(false);
  const [terminationCategory, setTerminationCategory] = useState("");
  const [terminationApprovalFile, setTerminationApprovalFile] = useState(null);
  const [terminationDate, setTerminationDate] = useState("");
  const [terminationTime, setTerminationTime] = useState("");
  const [terminationNote, setTerminationNote] = useState("");
  const [terminationConfirm, setTerminationConfirm] = useState(false);

  const closeFeedback = () => setTimeout(() => setFeedback(null), 1800);

  if (!service) {
    const rows = services
      .filter(s=>!search||[s.pppoe,s.userId,users.find(u=>u.userId===s.userId)?.nama].some(v=>String(v||"").toLowerCase().includes(search.toLowerCase())))
      .filter(s=>!statusFilter||s.status===statusFilter)
      .filter(s=>!branchFilter||s.branch===branchFilter)
      .filter(s=>!paketFilter||s.paket===paketFilter)
      .map((s) => ({ ...s, userNama: users.find((u) => u.userId === s.userId)?.nama }));
    return (
      <div className="flex-1 flex flex-col min-w-0" style={{ background: C.bgApp }}>
        <ListPageHeader icon={<Wifi size={17} color={C.accent} />} title="Service" subtitle={`${services.length} layanan terdaftar`} />
        <div className="px-6 pt-4 flex gap-2">
          <div style={{display:"flex",alignItems:"center",gap:7,flex:1,border:`1px solid ${C.border}`,borderRadius:8,padding:"7px 10px",background:C.bgPanel}}>
            <Search size={14} color={C.textFaint}/><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Cari PPPoE, User, atau data service" style={{border:"none",outline:"none",background:"transparent",color:C.text,width:"100%",fontSize:12.5}}/>
          </div>
          <FilterSelect label="Status Service" value={statusFilter} onChange={setStatusFilter} options={[{value:"",label:"All"},{value:"Active",label:"Active"},{value:"Isolir",label:"Isolir"},{value:"Terminated",label:"Terminated"}]}/>
          <FilterSelect label="Branch" value={branchFilter} onChange={setBranchFilter} options={[{value:"",label:"All"}, ...[...new Set(services.map(s=>s.branch))].map(x=>({value:x,label:x}))]}/>
          <FilterSelect label="Paket" value={paketFilter} onChange={setPaketFilter} options={[{value:"",label:"All"}, ...[...new Set(services.map(s=>s.paket))].map(x=>({value:x,label:x}))]}/>
        </div>
        <div className="p-6">
          <DataTable columns={[
            { key: "pppoe", label: "PPPoE Secret" },
            { key: "userId", label: "User ID" },
            { key: "userNama", label: "User" },
            { key: "paket", label: "Paket" },
            { key: "branch", label: "Branch" },
            { key: "status", label: "Status", render: (r) => <StatusDot status={r.status} /> },
          ]} rows={rows} onRowClick={(r) => openServiceDetail(r.pppoe)} />
        </div>
      </div>
    );
  }

  const owner = users.find((u) => u.userId === service.userId);
  const links = serviceContacts.filter((sc) => sc.pppoe === service.pppoe);

  const openEdit = (r) => {
    setEditServiceContact(r);
    setEditServiceRelationship(r.hubungan || "Pemilik");
    setEditServicePrimary(!!r.primary);
  };

  const saveRelationshipOnly = () => {
    if (!editServiceContact) return;
    const current = editServiceContact;
    const next = serviceContacts.map(sc => sc.id === current.id ? {...sc,hubungan:editServiceRelationship} : sc);
    if (actions?.replaceServiceContacts) actions.replaceServiceContacts(next);
    setEditServiceContact(null);
    setFeedback({type:"success",message:"Perubahan berhasil disimpan."}); closeFeedback();
  };

  const requestPrimaryChange = () => {
    if (!editServiceContact) return;
    if (editServiceContact.primary && !editServicePrimary) {
      setFeedback({type:"error",message:"Perubahan gagal disimpan. Service harus memiliki satu Primary Contact."}); closeFeedback();
      return;
    }
    // RULE BARU: nomor yang sudah primary di layanan lain tidak bisa dipromosikan di sini.
    if (!editServiceContact.primary && editServicePrimary && isPrimaryInOtherService(editServiceContact.contactId, service.pppoe, serviceContacts)) {
      const elsewhere = findPrimaryServiceForContact(editServiceContact.contactId, serviceContacts, service.pppoe);
      setFeedback({type:"error",message:"Gagal: nomor ini sudah menjadi Primary di layanan " + elsewhere + ". Satu nomor primary hanya bisa di satu layanan."}); closeFeedback();
      return;
    }
    if (!editServiceContact.primary && editServicePrimary) {
      setPendingPrimary({ ...editServiceContact, hubungan: editServiceRelationship });
      return;
    }
    saveRelationshipOnly();
  };

  const confirmPrimaryChange = () => {
    if (!pendingPrimary) return;
    const current = pendingPrimary;
    // RULE BARU: double-check lintas service sebelum apply.
    const elsewhere = findPrimaryServiceForContact(current.contactId, serviceContacts, service.pppoe);
    if (elsewhere) {
      setPendingPrimary(null);
      setFeedback({type:"error",message:"Gagal: nomor ini sudah menjadi Primary di layanan " + elsewhere + "."}); closeFeedback();
      return;
    }
    const next = serviceContacts.map(sc => {
      if (sc.pppoe !== service.pppoe) return sc;
      if (sc.contactId === current.contactId) return {...sc,hubungan:current.hubungan,primary:true};
      return {...sc,primary:false};
    });
    const primaryCount = next.filter(sc=>sc.pppoe===service.pppoe && sc.primary).length;
    if (primaryCount !== 1) {
      setFeedback({type:"error",message:"Perubahan gagal disimpan. Service harus memiliki satu Primary Contact."}); closeFeedback();
      return;
    }
    if (actions?.replaceServiceContacts) {
      const ok = actions.replaceServiceContacts(next);
      if (!ok) {
        setPendingPrimary(null);
        setFeedback({type:"error",message:"Gagal: melanggar aturan primary (satu service satu primary, satu nomor primary satu layanan)."}); closeFeedback();
        return;
      }
    }
    setPendingPrimary(null);
    setEditServiceContact(null);
    setFeedback({type:"success",message:"Perubahan berhasil disimpan."}); closeFeedback();
  };

  return (
    <div className="flex-1 flex flex-col min-w-0" style={{ background: C.bgApp, overflowY: "auto" }}>
      <DetailHeader onBack={back} title={service.pppoe} subtitle={`${service.paket} • ${service.branch}`} statusBadge={<StatusDot status={service.status} />} />
      <div className="p-6" style={{ maxWidth: 780 }}>
        <SectionCard title="Informasi Service" right={<button onClick={()=>{setEditPaket(service.paket);setEditDiscount(service.discountValue||"");setEditDiscountType(service.discountType||"Permanent");setEditServiceOpen(true);setTerminationOpen(false);}} style={{padding:"5px 10px",border:`1px solid ${C.accentSoftBorder}`,borderRadius:7,background:C.accentSoft,color:C.accent,fontSize:11.5,fontWeight:700,cursor:"pointer"}}>Edit</button>}>
          <InfoRow label="PPPoE Secret" value={service.pppoe} />
          <InfoRow label="Status" value={<StatusDot status={service.status} />} />
          <InfoRow label="Paket" value={service.paket} />
          <InfoRow label="Diskon" value={formatRupiah(service.discountValue)} />
          <InfoRow label="Subscribe Start" value={service.subStart} />
          <InfoRow label="Subscribe Expired" value={service.subExpired} />
          <InfoRow label="Peruntukan Layanan" value={service.peruntukan} />
        </SectionCard>
        <SectionCard title="Informasi User">
          <InfoRow label="User ID" value={owner?.userId} />
          <InfoRow label="Nama" value={owner?.nama} />
          <InfoRow label="NIK" value={maskNik(owner?.nik)} />
          <button onClick={() => openUserDetail(owner?.userId)} className="mt-2 py-1.5 px-3 rounded-md text-sm font-semibold" style={{ background: C.accentSoft, color: C.accent, border: `1px solid ${C.accentSoftBorder}`, cursor: "pointer" }}>Detail User</button>
        </SectionCard>
        <SectionCard title="Informasi AE">
          <InfoRow label="Nama Sales" value={service.salesType === "admin" ? "Admin" : service.salesName} />
          <InfoRow label="Nama Sales yang Survey" value={service.surveySalesName} />
        </SectionCard>
        <SectionCard title="Informasi Infra">
          <InfoRow label="Coverage Area" value={service.coverage} /><InfoRow label="Splitter" value={service.splitter} /><InfoRow label="Port" value={service.port} /><InfoRow label="SN Modem" value={service.snModem} /><InfoRow label="ONU" value={service.onu} />
        </SectionCard>
        <SectionCard title="Informasi Lokasi">
          <InfoRow label="Branch" value={service.branch} /><InfoRow label="Provinsi" value={service.provinsi} /><InfoRow label="Kota/Kabupaten" value={service.kotaKab} /><InfoRow label="Kecamatan" value={service.kecamatan} /><InfoRow label="Kelurahan" value={service.kelurahan} /><InfoRow label="RW" value={service.rw} /><InfoRow label="RT" value={service.rt} /><InfoRow label="Alamat" value={service.alamat} /><InfoRow label="Latitude" value={service.lat} /><InfoRow label="Longitude" value={service.lng} />
        </SectionCard>
        <SectionCard title="Finance"><InfoRow label="VA" value={service.va} /></SectionCard>

        <SectionCard title={`Contact Table (Primary 1:1)`}>
          <div style={{fontSize:11,color:C.textFaint,marginBottom:8,lineHeight:1.5}}>Satu service wajib satu Primary. Satu nomor Primary hanya bisa di satu layanan.</div>
          <DataTable
            columns={[
              { key:"nomorHp", label:"Nomor HP", render:r=>contacts.find(c=>c.contactId===r.contactId)?.nomorHp },
              { key:"nama", label:"Nama", render:r=>contacts.find(c=>c.contactId===r.contactId)?.nama },
              { key:"hubungan", label:"Hubungan" },
              { key:"primary", label:"Primary", render:r=>{
                const elsewhere = !r.primary ? findPrimaryServiceForContact(r.contactId, serviceContacts, service.pppoe) : null;
                if (r.primary) return <Check size={14} color={C.success}/>;
                if (elsewhere) return <span style={{fontSize:11,color:C.warning,fontWeight:600}} title={"Primary di " + elsewhere}>Primary di {elsewhere}</span>;
                return <span style={{color:C.textFaint}}>—</span>;
              } },
              { key:"action", label:"Action", render:r=><button onClick={e=>{e.stopPropagation();openEdit(r);}} style={{fontSize:11.5,padding:"4px 8px",border:`1px solid ${C.border}`,borderRadius:6,background:C.bgPanel,color:C.accent,cursor:"pointer"}}>Edit</button> },
              { key:"status", label:"Status", render:r=><StatusDot status={contacts.find(c=>c.contactId===r.contactId)?.status} /> },
            ]}
            rows={links}
            emptyLabel="Belum ada Contact untuk Service ini."
          />
        </SectionCard>
      </div>

      {editServiceContact && <Modal title="Edit Contact" onClose={()=>setEditServiceContact(null)}>
        <div className="flex flex-col gap-3">
          <InfoRow label="Nomor HP" value={contacts.find(c=>c.contactId===editServiceContact.contactId)?.nomorHp || "-"}/>
          <InfoRow label="Nama Contact" value={contacts.find(c=>c.contactId===editServiceContact.contactId)?.nama || "-"}/>
          <div><label style={{fontSize:11,color:C.textFaint,fontWeight:600}}>Hubungan</label>
            <select value={editServiceRelationship} onChange={e=>setEditServiceRelationship(e.target.value)} style={{width:"100%",marginTop:4,padding:"7px 8px",border:`1px solid ${C.border}`,borderRadius:7,background:C.bgPanel,color:C.text,fontSize:12}}>
              {["Pemilik","Keluarga","Pasangan","Anak","Orang Tua","PIC","Karyawan","Lainnya"].map(x=><option key={x}>{x}</option>)}
            </select>
          </div>
          <div><label style={{fontSize:11,color:C.textFaint,fontWeight:600}}>Primary Contact</label>
            <select value={editServicePrimary?"Yes":"No"} onChange={e=>setEditServicePrimary(e.target.value==="Yes")} disabled={!!editServiceContact.primary || !!findPrimaryServiceForContact(editServiceContact.contactId, serviceContacts, service.pppoe)}
              style={{width:"100%",marginTop:4,padding:"7px 8px",border:`1px solid ${C.border}`,borderRadius:7,background:(editServiceContact.primary || findPrimaryServiceForContact(editServiceContact.contactId, serviceContacts, service.pppoe))?C.bgPanelAlt:C.bgPanel,color:C.text,fontSize:12}}>
              <option value="Yes">Yes</option>
              <option value="No">No</option>
            </select>
            <div style={{fontSize:10.5,color:C.textFaint,marginTop:4}}>Service harus memiliki satu Primary Contact. Satu nomor Primary hanya bisa di satu layanan.</div>
            {findPrimaryServiceForContact(editServiceContact.contactId, serviceContacts, service.pppoe) && <div style={{fontSize:11,color:C.warning,marginTop:4,lineHeight:1.45}}>⚠ Nomor ini sudah Primary di {findPrimaryServiceForContact(editServiceContact.contactId, serviceContacts, service.pppoe)}. Tidak bisa dijadikan Primary di sini.</div>}
          </div>
          <div className="flex justify-end gap-2">
            <button onClick={()=>setEditServiceContact(null)} style={{padding:"7px 12px",border:`1px solid ${C.border}`,borderRadius:7,background:C.bgPanel,color:C.text,cursor:"pointer"}}>Batal</button>
            <button onClick={requestPrimaryChange} style={{padding:"7px 12px",border:"none",borderRadius:7,background:C.accent,color:"#fff",cursor:"pointer",fontWeight:600}}>Simpan</button>
          </div>
        </div>
      </Modal>}

      {pendingPrimary && <Modal title="Konfirmasi Primary Contact" onClose={()=>setPendingPrimary(null)}>
        <div style={{fontSize:12.5,color:C.text,lineHeight:1.5,marginBottom:14}}>Jadikan <b>{contacts.find(c=>c.contactId===pendingPrimary.contactId)?.nama || pendingPrimary.nama}</b> sebagai Primary Contact?</div>
        <div className="flex justify-end gap-2">
          <button onClick={()=>setPendingPrimary(null)} style={{padding:"7px 12px",border:`1px solid ${C.border}`,borderRadius:7,background:C.bgPanel,color:C.text,cursor:"pointer"}}>Batal</button>
          <button onClick={confirmPrimaryChange} style={{padding:"7px 12px",border:"none",borderRadius:7,background:C.accent,color:"#fff",cursor:"pointer",fontWeight:600}}>Konfirmasi</button>
        </div>
      </Modal>}

      {editServiceOpen && <Modal title="Edit Service" onClose={()=>setEditServiceOpen(false)} width={terminationOpen ? 620 : 340}>
        {!terminationOpen ? <div className="flex flex-col gap-3">
          <InfoRow label="PPPoE Secret" value={service.pppoe}/>
          <div><label style={{fontSize:11,color:C.textFaint,fontWeight:600}}>Paket Layanan</label><select value={editPaket} onChange={e=>setEditPaket(e.target.value)} style={{width:"100%",marginTop:4,padding:"7px 8px",border:`1px solid ${C.border}`,borderRadius:7,background:C.bgPanel,color:C.text,fontSize:12}}>{["10 Mbps","30 Mbps","50 Mbps","100 Mbps"].map(x=><option key={x}>{x}</option>)}</select></div>
          <div><label style={{fontSize:11,color:C.textFaint,fontWeight:600}}>Diskon</label><div style={{display:"flex",alignItems:"center",marginTop:4,border:`1px solid ${C.border}`,borderRadius:7,background:C.bgPanel,overflow:"hidden"}}><span style={{padding:"7px 0 7px 8px",color:C.textSoft,fontSize:12,fontWeight:600}}>Rp</span><input inputMode="numeric" value={formatRupiah(editDiscount).replace(/^Rp\s?/,"")} onChange={e=>setEditDiscount(parseRupiah(e.target.value))} placeholder="0" style={{width:"100%",border:"none",outline:"none",padding:"7px 8px 7px 4px",background:"transparent",color:C.text,fontSize:12}}/></div></div>
          <div><label style={{fontSize:11,color:C.textFaint,fontWeight:600}}>Tipe Diskon</label><select value={editDiscountType} onChange={e=>setEditDiscountType(e.target.value)} style={{width:"100%",marginTop:4,padding:"7px 8px",border:`1px solid ${C.border}`,borderRadius:7,background:C.bgPanel,color:C.text,fontSize:12}}><option>Permanent</option><option>Non Permanent</option></select></div>
          <div className="flex justify-between gap-2">
            <button disabled={service.status === "Terminated"} onClick={()=>{if(service.status !== "Terminated"){setTerminationApprovalFile(null);setTerminationDate("");setTerminationTime("");setTerminationOpen(true);}}} style={{padding:"7px 11px",border:`1px solid ${service.status === "Terminated" ? C.border : C.danger}`,borderRadius:7,background:service.status === "Terminated" ? C.bgPanelAlt : C.dangerSoft,color:service.status === "Terminated" ? C.textFaint : C.danger,fontSize:11.5,fontWeight:700,cursor:service.status === "Terminated" ? "not-allowed" : "pointer",opacity:service.status === "Terminated" ? 0.8 : 1}}>Terminate</button>
            <div className="flex gap-2"><button onClick={()=>setEditServiceOpen(false)} style={{padding:"7px 12px",border:`1px solid ${C.border}`,borderRadius:7,background:C.bgPanel,color:C.text,cursor:"pointer"}}>Batal</button><button onClick={()=>{actions.updateService(service.pppoe,{paket:editPaket,discountValue:editDiscount,discountType:editDiscountType});setEditServiceOpen(false);setFeedback({type:"success",message:"Service berhasil diperbarui."});}} style={{padding:"7px 12px",border:"none",borderRadius:7,background:C.accent,color:"#fff",fontWeight:600,cursor:"pointer"}}>Simpan</button></div>
          </div>
        </div> : <div className="flex flex-col gap-3">
          <div style={{fontSize:12.5,color:C.textSoft}}>Lengkapi data termination sebelum melakukan konfirmasi.</div>
          <div><label style={{fontSize:11,color:C.textFaint,fontWeight:600}}>Kategori Terminated</label><select value={terminationCategory} onChange={e=>setTerminationCategory(e.target.value)} style={{width:"100%",marginTop:4,padding:"7px 8px",border:`1px solid ${C.border}`,borderRadius:7,background:C.bgPanel,color:C.text,fontSize:12}}><option value="">Pilih kategori</option>{["Tidak puas dengan layanan aftersales (Customer Care)","Tidak puas dengan kualitas internet","Tidak puas dengan layanan umum","Tidak puas dengan layanan sales","Alasan keuangan","Pindah alamat — berhenti berlangganan","Pindah alamat — lanjut berlangganan","Penawaran kompetitor","Customer hilang tanpa kabar","Customer tidak memberikan alasan","Pembatalan berlangganan tiba-tiba","Lainnya"].map(x=><option key={x}>{x}</option>)}</select></div>
          <div><label style={{fontSize:11,color:C.textFaint,fontWeight:600}}>Bukti Persetujuan</label><div style={{marginTop:4,padding:"7px 8px",border:`1px solid ${C.border}`,borderRadius:7,background:C.bgPanel}}><input type="file" onChange={e=>setTerminationApprovalFile(e.target.files?.[0] || null)} style={{width:"100%",color:C.text,fontSize:12}}/></div></div>
          <div style={{display:"grid",gridTemplateColumns:"minmax(0,1fr) minmax(0,1fr)",gap:10}}>
            <div style={{minWidth:0}}><label style={{fontSize:11,color:C.textFaint,fontWeight:600,whiteSpace:"nowrap"}}>Suggest Tanggal Pengambilan</label><input type="date" value={terminationDate} onChange={e=>{const next=e.target.value;setTerminationDate(next);if(!next)setTerminationTime("");}} style={{width:"100%",marginTop:4,padding:"7px 8px",border:`1px solid ${C.border}`,borderRadius:7,background:C.bgPanel,color:C.text,fontSize:12}}/></div>
            <div style={{minWidth:0}}><label style={{fontSize:11,color:C.textFaint,fontWeight:600,whiteSpace:"nowrap"}}>Suggest Jam Pengambilan</label><input type="time" value={terminationTime} onChange={e=>setTerminationTime(e.target.value)} disabled={!terminationDate} style={{width:"100%",marginTop:4,padding:"7px 8px",border:`1px solid ${C.border}`,borderRadius:7,background:!terminationDate?C.bgPanelAlt:C.bgPanel,color:!terminationDate?C.textFaint:C.text,fontSize:12,cursor:!terminationDate?"not-allowed":"text",opacity:!terminationDate?0.8:1}}/></div>
          </div>
          <div><label style={{fontSize:11,color:C.textFaint,fontWeight:600}}>Keterangan</label><textarea value={terminationNote} onChange={e=>setTerminationNote(e.target.value)} style={{width:"100%",marginTop:4,padding:"7px 8px",border:`1px solid ${C.border}`,borderRadius:7,background:C.bgPanel,color:C.text,fontSize:12,minHeight:60}}/></div>
          <div className="flex justify-end gap-2"><button onClick={()=>setTerminationOpen(false)} style={{padding:"7px 12px",border:`1px solid ${C.border}`,borderRadius:7,background:C.bgPanel,color:C.text,cursor:"pointer"}}>Batal</button><button disabled={!terminationCategory} onClick={()=>setTerminationConfirm(true)} style={{padding:"7px 12px",border:"none",borderRadius:7,background:terminationCategory?C.danger:"#aeb7c5",color:"#fff",fontWeight:600,cursor:terminationCategory?"pointer":"not-allowed"}}>Lanjutkan</button></div>
        </div>}
      </Modal>}
      {terminationConfirm && <Modal title="Konfirmasi Terminate Service" onClose={()=>setTerminationConfirm(false)}>
        <div style={{fontSize:12.5,color:C.text,lineHeight:1.55,marginBottom:14}}><b>Apakah Anda yakin ingin melakukan Terminate Service?</b><div style={{marginTop:8}}>Service / PPPoE Secret: <b>{service.pppoe}</b></div><div>Paket: <b>{service.paket}</b></div><div>Kategori: <b>{terminationCategory}</b></div><div>Bukti persetujuan: <b>{terminationApprovalFile?.name || "-"}</b></div><div>Suggest tanggal pengambilan: <b>{terminationDate || "-"}</b></div><div>Suggest jam pengambilan: <b>{terminationTime || "-"}</b></div></div>
        <div className="flex justify-end gap-2"><button onClick={()=>setTerminationConfirm(false)} style={{padding:"7px 12px",border:`1px solid ${C.border}`,borderRadius:7,background:C.bgPanel,color:C.text,cursor:"pointer"}}>Batal</button><button onClick={()=>{actions.updateService(service.pppoe,{status:"Terminated",termination:{category:terminationCategory,approvalFile:terminationApprovalFile ? {name:terminationApprovalFile.name,type:terminationApprovalFile.type,size:terminationApprovalFile.size,lastModified:terminationApprovalFile.lastModified} : null,date:terminationDate,time:terminationTime,note:terminationNote}});setTerminationConfirm(false);setEditServiceOpen(false);setFeedback({type:"success",message:"Service berhasil menjadi Terminated."});}} style={{padding:"7px 12px",border:"none",borderRadius:7,background:C.danger,color:"#fff",fontWeight:700,cursor:"pointer"}}>Konfirmasi Terminate</button></div>
      </Modal>}
      {feedback && <CR12Toast message={feedback.message} type={feedback.type} onClose={()=>setFeedback(null)}/>}
    </div>
  );
}

/* ============================================================
