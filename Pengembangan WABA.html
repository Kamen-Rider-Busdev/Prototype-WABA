function ContactModule({ contacts, users, services, serviceContacts, selectedContactId, openContactDetail, back, openServiceDetail, actions }) {
  const contact = contacts.find((c) => c.contactId === selectedContactId);
  // Keep all hooks unconditional so Contact List <-> Contact Detail navigation is stable.
  const [search,setSearch]=useState("");
  const [statusFilter,setStatusFilter]=useState("");
  const [primaryFilter,setPrimaryFilter]=useState("");
  const [editContact, setEditContact] = useState(null);
  const [editStatus, setEditStatus] = useState("");
  const [matchOpen, setMatchOpen] = useState(false);
  const [matchSearch, setMatchSearch] = useState("");
  const [matchExecuted, setMatchExecuted] = useState(false);
  const [candidate, setCandidate] = useState(null);
  const [hubungan, setHubungan] = useState("");
  const [matchNotice, setMatchNotice] = useState("");
  const [matchFeedback, setMatchFeedback] = useState(null);
  const servicesForContact = (contactId) => serviceContacts.filter((sc) => sc.contactId === contactId);

  if (!contact) {
    const rows = Array.from(new Map(contacts
      .filter(c => !search || [c.nomorHp,c.nama].some(v=>String(v||"").toLowerCase().includes(search.toLowerCase())))
      .filter(c => !statusFilter || c.status === statusFilter)
      .map(c => [c.nomorHp, c])
    ).values());
    return (
      <div className="flex-1 flex flex-col min-w-0" style={{ background: C.bgApp }}>
        <ListPageHeader icon={<Phone size={17} color={C.accent} />} title="Contact" subtitle={`${contacts.length} contact terdaftar`} />
        <div className="px-6 pt-4 flex gap-2"><div style={{display:"flex",alignItems:"center",gap:7,flex:1,border:`1px solid ${C.border}`,borderRadius:8,padding:"7px 10px",background:C.bgPanel}}><Search size={14} color={C.textFaint}/><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Cari Nomor HP atau Nama" style={{border:"none",outline:"none",background:"transparent",color:C.text,width:"100%",fontSize:12.5}}/></div><FilterSelect label="Status Contact" value={statusFilter} onChange={setStatusFilter} options={[{value:"",label:"All"},{value:"Active",label:"Active"},{value:"Non Active",label:"Non Active"}]}/></div>
        <div className="p-6">
          <DataTable
            columns={[
              { key: "nomorHp", label: "Nomor HP" },
              { key: "nama", label: "Nama" },
              { key: "verification", label: "Verifikasi", render:r=><Badge bg={r.verification==="Identified"?C.successSoft:C.warningSoft} fg={r.verification==="Identified"?C.success:C.warning}>{r.verification}</Badge> },
              { key: "status", label: "Status", render: (r) => <StatusDot status={r.status} /> },
              { key: "action", label: "Action", render: (r) =>
                <button onClick={(e)=>{e.stopPropagation();setEditContact(r.contactId);setEditStatus(r.status);}}
                  style={{fontSize:11,padding:"4px 9px",border:`1px solid ${C.border}`,borderRadius:6,background:C.bgPanel,color:C.accent,cursor:"pointer"}}>Edit</button>
              },
            ]}
            rows={rows}
            onRowClick={(r) => openContactDetail(r.contactId)}
          />
          {editContact && (() => {
            const editing = contacts.find(c => c.contactId === editContact);
            if (!editing) return null;
            return (
              <Modal title="Edit Status Contact" onClose={()=>{setEditContact(null);setEditStatus("");}}>
                <div className="flex flex-col gap-3">
                  <InfoRow label="Nomor HP" value={editing.nomorHp} />
                  <InfoRow label="Nama" value={editing.nama} />
                  <div>
                    <label style={{fontSize:11,color:C.textFaint,fontWeight:600}}>Status Contact</label>
                    <select value={editStatus} onChange={e=>setEditStatus(e.target.value)}
                      style={{width:"100%",marginTop:4,fontSize:12.5,border:`1px solid ${C.border}`,borderRadius:7,padding:"7px 8px",background:C.bgPanel,color:C.text}}>
                      <option value="Active">Active</option>
                      <option value="Non Active">Inactive</option>
                    </select>
                  </div>
                  <div className="flex justify-end gap-2">
                    <button onClick={()=>{setEditContact(null);setEditStatus("");}}
                      style={{padding:"7px 12px",border:`1px solid ${C.border}`,borderRadius:7,background:C.bgPanel,color:C.text,cursor:"pointer"}}>Batal</button>
                    <button onClick={()=>{actions.updateContactStatus(editing.contactId,editStatus);setEditContact(null);setEditStatus("");}}
                      style={{padding:"7px 12px",border:"none",borderRadius:7,background:C.accent,color:"#fff",cursor:"pointer",fontWeight:600}}>Simpan</button>
                  </div>
                </div>
              </Modal>
            );
          })()}
        </div>
      </div>
    );
  }

  const links = servicesForContact(contact.contactId);
  const ownerUsers = [...new Set(links.map((l) => services.find((s) => s.pppoe === l.pppoe)?.userId).filter(Boolean))].map((id) => users.find((u) => u.userId === id));
  const relatedPppoe = new Set(links.map(l => l.pppoe));
  const myPrimaryPppoe = findPrimaryServiceForContact(contact.contactId, serviceContacts, null);
  const searchPool = matchExecuted && matchSearch.trim()
    ? evaluateServiceMatch(matchSearch, services, relatedPppoe).results
    : [];
  const closeMatch = () => { setMatchOpen(false); setMatchSearch(""); setMatchExecuted(false); setCandidate(null); setHubungan(""); setMatchNotice(""); };
  const confirmExisting = () => {
    if (!candidate || !hubungan || (contact.verification==="Unknown" && !contact.nama?.trim())) { setMatchFeedback({type:"error",message:"Konfirmasi gagal, data belum lengkap."}); return; }
    // Fitur "jadikan primary" dihapus dari card: link baru selalu Non-Primary.
    const ok = actions.confirmExistingServiceMatch(contact.contactId, candidate.pppoe, hubungan, false);
    if (!ok) {
      setMatchFeedback({type:"error",message:"Gagal menghubungkan service. Service sudah memiliki Primary Contact."});
      return;
    }
    closeMatch();
    setMatchFeedback({type:"success",message:"Service berhasil dihubungkan ke Contact ini."});
  };

  return (
    <div className="flex-1 flex flex-col min-w-0" style={{ background: C.bgApp, overflowY: "auto" }}>
      <DetailHeader onBack={back} title={contact.verification==="Unknown" ? contact.nomorHp : (contact.nama || contact.nomorHp)} subtitle={contact.nomorHp} statusBadge={<StatusDot status={contact.status} />} />
      <div className="p-6" style={{ maxWidth: 780 }}>
        <SectionCard title="Contact Information">
          <InfoRow label="Nomor HP" value={contact.nomorHp} />
          <InfoRow label="Nama" value={contact.nama} />
          <InfoRow label="Status Contact" value={<StatusDot status={contact.status} />} />
          <InfoRow label="Primary di" value={myPrimaryPppoe || "-"} />
          {myPrimaryPppoe && <div style={{fontSize:11,color:C.textFaint,marginTop:6,lineHeight:1.45}}>Satu nomor primary hanya bisa di satu layanan. Untuk memindahkan, jadikan Non-Primary dulu di {myPrimaryPppoe} via Detail Service.</div>}
        </SectionCard>

        <SectionCard title={`User Cards (${ownerUsers.length})`}>
          {ownerUsers.length === 0 && <p style={{ fontSize: 12.5, color: C.textFaint }}>Belum terhubung ke User manapun.</p>}
          <div className="flex flex-col gap-2">
            {ownerUsers.map((u) => (
              <div key={u.userId} style={{ border: `1px solid ${C.border}`, borderRadius: 10, padding: 12 }}>
                <div style={{ fontSize: 13.5, fontWeight: 700 }}>{u.nama}</div>
                <div style={{ fontSize: 12, color: C.textFaint }}>{u.userId} • NIK {maskNik(u.nik)}</div>
              </div>
            ))}
          </div>
        </SectionCard>

        <button onClick={()=>{setMatchOpen(true);setMatchSearch("");setMatchExecuted(false);setCandidate(null);setHubungan("");setMatchNotice("");}} className="mb-3 py-2 px-3 rounded-md text-sm font-semibold flex items-center gap-1.5" style={{background:C.accentSoft,color:C.accent,border:`1px solid ${C.accentSoftBorder}`,cursor:"pointer"}}><Search size={14}/> Cocokkan Layanan</button>

        {matchOpen && <Modal title="Cocokkan Layanan" onClose={closeMatch}>
          <div style={{display:"flex",alignItems:"center",gap:7,border:`1px solid ${C.border}`,borderRadius:8,padding:"7px 9px",background:C.bgPanelAlt,marginBottom:8}}>
            <Search size={14} color={C.textFaint}/><input autoFocus value={matchSearch} onChange={e=>{setMatchSearch(e.target.value);setMatchExecuted(false);setCandidate(null);setMatchNotice("");}} placeholder="PPoE Secret..." style={{border:"none",outline:"none",background:"transparent",color:C.text,width:"100%",fontSize:12.5}}/>
          </div>
          <button onClick={()=>{
            setCandidate(null);
            const evalResult = evaluateServiceMatch(matchSearch, services, relatedPppoe);
            if (evalResult.status === "empty" || evalResult.status === "already") {
              setMatchExecuted(false); setMatchNotice(evalResult.notice); return;
            }
            setMatchNotice(""); setMatchExecuted(true);
          }} style={{width:"100%",background:C.accent,color:"#fff",border:"none",borderRadius:8,padding:"8px 0",fontSize:12.5,fontWeight:600,cursor:"pointer",marginBottom:9}}>Cari Layanan</button>
          {matchNotice && <div style={{background:C.warningSoft,border:`1px solid ${C.warningSoftBorder || C.border}`,color:C.warning,padding:"8px 9px",borderRadius:8,fontSize:12,marginBottom:8}}>⚠ {matchNotice}</div>}
          {!candidate && !matchExecuted && !matchNotice && <div style={{fontSize:12,color:C.textFaint,padding:"10px 4px",textAlign:"center"}}>Masukkan PPoE Secret, lalu klik Cari Layanan.</div>}
          {!candidate && matchExecuted && <div className="flex flex-col gap-1.5" style={{maxHeight:250,overflowY:"auto"}}>{searchPool.map(svc=>{const owner=users.find(u=>u.userId===svc.userId);return <button key={svc.pppoe} onClick={()=>setCandidate(svc)} style={{textAlign:"left",padding:9,border:`1px solid ${C.border}`,borderRadius:8,background:C.bgPanel,color:C.text,cursor:"pointer"}}><div style={{fontSize:12.5,fontWeight:700}}>{svc.pppoe}</div><div style={{fontSize:11.5,color:C.textFaint}}>{owner?.nama||"-"} • {svc.alamat||"-"} • {svc.status}</div></button>})}</div>}
          {candidate && <><SectionCard title="Kandidat Service"><div style={{fontSize:13.5,fontWeight:700}}>{candidate.pppoe}</div><div style={{fontSize:12,color:C.textFaint,marginTop:2}}>{candidate.status} • {candidate.paket} • {candidate.branch}</div><div style={{fontSize:12,color:C.textSoft,marginTop:5}}>Nama User: <b>{users.find(u=>u.userId===candidate.userId)?.nama||"-"}</b></div><div style={{fontSize:12,color:C.textSoft,marginTop:2}}>Alamat: {candidate.alamat||"-"}</div></SectionCard><SectionCard title="Lengkapi Informasi Contact">
  <div className="flex flex-col gap-2.5">
    <InfoRow label="Nomor HP" value={contact.nomorHp}/>
    {contact.verification === "Unknown" ? <div>
      <label style={{fontSize:11,color:C.textFaint,fontWeight:600}}>Nama</label>
      <input value={contact.nama || ""} onChange={e=>actions.updateContactName(contact.contactId,e.target.value)} placeholder="Nama customer..." style={{width:"100%",marginTop:3,fontSize:12.5,border:`1px solid ${C.border}`,borderRadius:7,padding:"7px 8px",background:C.bgPanel,color:C.text}}/>
    </div> : <InfoRow label="Nama" value={contact.nama}/>}
    <div><label style={{fontSize:11,color:C.textFaint,fontWeight:600}}>Hubungan</label>
      <select value={hubungan} onChange={e=>setHubungan(e.target.value)} style={{width:"100%",marginTop:3,fontSize:12.5,border:`1px solid ${C.border}`,borderRadius:7,padding:"7px 8px",background:C.bgPanel,color:C.text}}>
        <option value="">Pilih hubungan</option>{["Pemilik","Keluarga","Pasangan","Anak","Orang Tua","PIC","Karyawan","Lainnya"].map(x=><option key={x}>{x}</option>)}
      </select>
    </div>
    <div style={{fontSize:11,color:C.textFaint,lineHeight:1.45}}>Nomor baru akan ditambahkan sebagai Non-Primary.</div>
  </div>
  <div className="flex justify-end gap-2 mt-3">
    <button onClick={()=>{setCandidate(null);setHubungan("");}} style={{padding:"7px 12px",border:`1px solid ${C.border}`,borderRadius:7,background:C.bgPanel,color:C.textSoft,cursor:"pointer"}}>Batal</button>
    <button disabled={!hubungan || (contact.verification==="Unknown" && !contact.nama?.trim())} onClick={confirmExisting} style={{padding:"7px 12px",border:"none",borderRadius:7,background:(hubungan && (contact.verification!=="Unknown" || contact.nama?.trim()))?C.accent:"#aeb7c5",color:"#fff",cursor:(hubungan && (contact.verification!=="Unknown" || contact.nama?.trim()))?"pointer":"not-allowed"}}>Konfirmasi</button>
  </div>
</SectionCard></>}
        </Modal>}
        {matchFeedback && <CR12Toast message={matchFeedback.message} type={matchFeedback.type} onClose={()=>setMatchFeedback(null)}/>}


        <SectionCard title={`Service Cards (${links.length})${myPrimaryPppoe ? ` • Primary di ${myPrimaryPppoe}` : ""}`}>
          <div className="flex flex-col gap-2.5">
            {links.map((l) => {
              const svc = services.find((s) => s.pppoe === l.pppoe);
              const sc = statusColor(svc?.status);
              const owner = users.find((u) => u.userId === svc?.userId);
              return (
                <div key={l.id} style={{ border: `1px solid ${C.border}`, borderRadius: 10, padding: 12 }}>
                  <div className="flex items-center justify-between">
                    <span style={{ fontSize: 13.5, fontWeight: 700 }}>{svc.pppoe}</span>
                    <Badge bg={sc.bg} fg={sc.fg}>{sc.label}</Badge>
                  </div>
                  <div style={{ fontSize: 12, color: C.textFaint, marginTop: 2 }}>User: {owner?.nama}</div>
                  <div className="flex items-center gap-2 mt-2">
                    <Badge bg={C.bgPanelAlt} fg={C.textSoft} border={C.border}>Hubungan: {l.hubungan}</Badge>
                    {l.primary ? <Badge bg={C.successSoft} fg={C.success}>Primary</Badge> : <Badge bg="#f1f2f5" fg={C.textFaint}>Non Primary</Badge>}
                  </div>
                  <button onClick={() => openServiceDetail(svc.pppoe)} className="mt-2.5 py-1.5 px-3 rounded-md text-sm font-semibold" style={{ background: C.bgPanel, color: C.accent, border: `1px solid ${C.accentSoftBorder}`, cursor: "pointer" }}>
                    Detail Service
                  </button>
                </div>
              );
            })}
          </div>
        </SectionCard>
      </div>
    </div>
  );
}

function CR12Toast({message,type="success",onClose}) {
  if (!message) return null;
  return <div style={{position:"fixed",right:20,bottom:20,zIndex:10000,padding:"9px 13px",borderRadius:8,
    background:type==="success"?"#16834b":"#b42318",color:"#fff",fontSize:12,fontWeight:600,
    boxShadow:"0 8px 24px rgba(0,0,0,.18)"}}>{message}</div>;
}
function App() {
  const [activeMenu, setActiveMenu] = useState("chat");
  const [theme, setTheme] = useState("light");
  const [activeAccountId] = useState("tachta");
  const [logoutConfirmOpen, setLogoutConfirmOpen] = useState(false);
  const [loggedOut, setLoggedOut] = useState(false);
  C = theme === "dark" ? DARK_C : LIGHT_C;
  const accounts = [
    { id:"tachta", name:"Tachta", role:"Customer Care" },
    { id:"andi", name:"Andi", role:"Customer Care" },
    { id:"sinta", name:"Sinta", role:"Customer Care" },
  ];
  const activeAccount = accounts.find(a => a.id === activeAccountId) || accounts[0];

  const [users] = useState(USERS0);
  const [services, setServices] = useState(SERVICES0);
  const [contacts, setContacts] = useState(CONTACTS0);
  const [serviceContacts, setServiceContacts] = useState(SERVICE_CONTACTS0);
  const [tags, setTags] = useState(TAGS0);
  const [chats, setChats] = useState(CHATS0);
  const [templates, setTemplates] = useState(TEMPLATE_CHATS0);

  // Chat state
  const [selectedChatId, setSelectedChatId] = useState(null);
  const [profileOpen, setProfileOpen] = useState(false);
  const [selectionMode, setSelectionMode] = useState(false);
  const [selectedChatIds, setSelectedChatIds] = useState([]);
  const [deleteConfirmOpen, setDeleteConfirmOpen] = useState(false);
  const [filter, setFilter] = useState(["semua"]);
  const [labelFilter, setLabelFilter] = useState(null);

  // Cross-module detail selection
  const [selectedUserId, setSelectedUserId] = useState(null);
  const [selectedPppoe, setSelectedPppoe] = useState(null);
  const [selectedContactId, setSelectedContactId] = useState(null);

  const changeMenu = (key) => {
    setActiveMenu(key);
    setSelectedUserId(null);
    setSelectedPppoe(null);
    setSelectedContactId(null);
    setSelectionMode(false);
    setSelectedChatIds([]);
  };

  const openUserDetail = (id) => { setActiveMenu("user"); setSelectedUserId(id); };
  const openServiceDetail = (pppoe) => { setActiveMenu("service"); setSelectedPppoe(pppoe); };
  const openContactDetail = (id) => { setActiveMenu("contact"); setSelectedContactId(id); };

  // ---- Match / ACC flow actions ----
  const updateChat = (id, patch) => setChats((prev) => prev.map((c) => (c.id === id ? { ...c, ...patch } : c)));

  const matchAskRelation = (chatId) => {
    updateChat(chatId, {
      matchStep: "asked",
      messages: [...chats.find((c) => c.id === chatId).messages, { from: "cc", text: "Baik, boleh diinfokan hubungan Bapak/Ibu dengan pemilik layanan?", time: "Baru saja" }],
    });
  };

  const matchSimulateReply = (chatId) => {
    const chat = chats.find((c) => c.id === chatId);
    updateChat(chatId, {
      matchStep: "replied",
      candidateHubungan: "Anak",
      messages: [...chat.messages, { from: "customer", text: "Saya anaknya kak", time: "Baru saja" }],
    });
  };

  const matchConfirmAcc = (chatId, { nama, hubungan, primary }) => {
    const chat = chats.find((c) => c.id === chatId);
    if (!chat || !chat.candidatePppoe) return false;
    const existing = contacts.find(c => c.nomorHp === chat.nomorHp);
    const contactId = existing?.contactId || ("C" + Date.now());
    // RULE BARU: cegah nomor yang sudah primary di layanan lain jadi primary lagi.
    const primaryElsewhere = findPrimaryServiceForContact(contactId, serviceContacts, chat.candidatePppoe);
    const sameService = serviceContacts.filter(sc => sc.pppoe === chat.candidatePppoe);
    const hasPrimary = sameService.some(sc => sc.primary);
    const wantsPrimary = primary || !hasPrimary;
    if (wantsPrimary && primaryElsewhere) return false;
    const newContact = { contactId, nomorHp: chat.nomorHp, nama, prospectId: existing?.prospectId || "-", status: existing?.status || "Active", verification:"Identified" };
    const newLink = { id: "SC" + Date.now(), pppoe: chat.candidatePppoe, contactId, hubungan, primary: wantsPrimary };

    setContacts(prev => existing ? prev.map(c => c.contactId === contactId ? newContact : c) : [...prev,newContact]);
    setServiceContacts(prev => {
      if (prev.some(sc=>sc.contactId===contactId && sc.pppoe===chat.candidatePppoe)) return prev;
      const err = validatePrimaryRules([...prev.filter(sc => !(sc.pppoe === chat.candidatePppoe && wantsPrimary && sc.primary)), { ...newLink, primary:wantsPrimary }]);
      if (err) return prev;
      const normalized = wantsPrimary ? prev.map(sc => sc.pppoe === chat.candidatePppoe ? { ...sc, primary:false } : sc) : prev;
      return [...normalized, { ...newLink, primary:wantsPrimary }];
    });
    updateChat(chatId, {
      matchStep: "acc",
      contactId,
      messages: [...chat.messages, { from: "cc", text: `Terima kasih, sudah kami catat sebagai kontak layanan ${chat.candidatePppoe} ya`, time: "Baru saja" }],
    });
    return true;
  };

  const updateContactStatus = (contactId, status) => setContacts(prev => prev.map(c => c.contactId === contactId ? { ...c, status } : c));
  const updateContactName = (contactId, nama) => setContacts(prev => prev.map(c => c.contactId === contactId ? { ...c, nama } : c));
  const updateService = (pppoe, patch) => setServices(prev => prev.map(s => s.pppoe === pppoe ? { ...s, ...patch } : s));
  const updateServiceContactRelationship = (relationId, hubungan) => setServiceContacts(prev => prev.map(sc => sc.id === relationId ? { ...sc, hubungan } : sc));
  const confirmExistingServiceMatch = (contactId, pppoe, hubungan, requestedPrimary=false) => {
    if (serviceContacts.some(sc => sc.contactId === contactId && sc.pppoe === pppoe)) return false;
    const sameService = serviceContacts.filter(sc => sc.pppoe === pppoe);
    const shouldPrimary = requestedPrimary || !sameService.some(sc => sc.primary);
    // RULE BARU: satu nomor primary hanya di satu layanan.
    if (shouldPrimary && isPrimaryInOtherService(contactId, pppoe, serviceContacts)) return false;
    const nextPreview = [
      ...(shouldPrimary ? serviceContacts.map(sc => sc.pppoe === pppoe ? { ...sc, primary:false } : sc) : serviceContacts),
      { id: "SC" + Date.now(), pppoe, contactId, hubungan, primary: shouldPrimary }
    ];
    if (validatePrimaryRules(nextPreview)) return false;
    setServiceContacts(prev => {
      if (prev.some(sc => sc.contactId === contactId && sc.pppoe === pppoe)) return prev;
      if (shouldPrimary && isPrimaryInOtherService(contactId, pppoe, prev)) return prev;
      const normalized = shouldPrimary ? prev.map(sc => sc.pppoe === pppoe ? { ...sc, primary:false } : sc) : prev;
      const newLink = { id: "SC" + Date.now(), pppoe, contactId, hubungan, primary: shouldPrimary };
      return [...normalized, newLink];
    });
    setContacts(prev => prev.map(c => c.contactId === contactId ? {...c, verification:"Identified", nama:c.nama || "-"} : c));
    return true;
  };
  const changePrimary = (contactId, pppoe) => {
    // RULE BARU: jangan pindahkan primary ke nomor yang sudah primary di layanan lain.
    if (isPrimaryInOtherService(contactId, pppoe, serviceContacts)) return false;
    setServiceContacts(prev => {
      if (isPrimaryInOtherService(contactId, pppoe, prev)) return prev;
      return prev.map(sc => sc.pppoe === pppoe ? { ...sc, primary: sc.contactId === contactId } : sc);
    });
    return true;
  };
  const toggleChatFilter = (key) => setFilter(prev => {
    const current = Array.isArray(prev) ? prev : [prev || "semua"];
    let next = [...current];
    const incompatible = { semua:"unread", unread:"semua", kiosnet:"griyanet", griyanet:"kiosnet" };
    if (next.includes(key)) {
      next = next.filter(x => x !== key);
    } else {
      next = [...next.filter(x => x !== incompatible[key]), key];
    }
    return next.length ? next : ["semua"];
  });

  const enterSelectionMode = (id) => {
    setSelectionMode(true);
    setSelectedChatIds(prev => prev.includes(id) ? prev : [...prev, id]);
  };
  const toggleChatSelection = (id) => setSelectedChatIds(prev => prev.includes(id) ? prev.filter(x=>x!==id) : [...prev, id]);
  const toggleSelectAllChats = (chatIds = []) => {
    const ids = [...new Set((chatIds || []).filter(Boolean))];
    setSelectedChatIds(prev => {
      if (!ids.length) return prev;
      const allSelected = ids.every(id => prev.includes(id));
      if (allSelected) return prev.filter(id => !ids.includes(id));
      return [...new Set([...prev, ...ids])];
    });
  };
  const exitSelectionMode = () => { setSelectionMode(false); setSelectedChatIds([]); setDeleteConfirmOpen(false); };
  const requestDeleteSelected = () => { if (selectedChatIds.length) setDeleteConfirmOpen(true); };
  const cancelDeleteSelected = () => setDeleteConfirmOpen(false);
  const confirmDeleteSelected = () => {
    const ids = new Set(selectedChatIds);
    setChats(prev => prev.filter(c => !ids.has(c.id)));
    setSelectedChatIds([]);
    setSelectionMode(false);
    setDeleteConfirmOpen(false);
    if (selectedChatId && ids.has(selectedChatId)) { setSelectedChatId(null); setProfileOpen(false); }
  };

  const chatActions = {
    selectChat: (id) => { setSelectedChatId(id); setProfileOpen(true); setChats((prev) => prev.map((c) => (c.id === id ? { ...c, unread: 0 } : c))); },
    enterSelectionMode,
    toggleChatSelection,
    toggleSelectAllChats,
    exitSelectionMode,
    requestDeleteSelected,
    cancelDeleteSelected,
    confirmDeleteSelected,
    setProfileOpen,
    setFilter: toggleChatFilter,
    setLabelFilter,
    replaceServiceContacts: (next) => {
      const err = validatePrimaryRules(next);
      if (err) return false;
      setServiceContacts(next);
      return true;
    },
    selectUnknownService: (chatId, pppoe) => updateChat(chatId, { matchStep:"matched", candidatePppoe:pppoe, candidateHubungan:"", candidatePrimary:false }),

    createTag: (tag) => setTags((prev) => [...prev, tag]),
    setTagsForChat: (id, tagIds) => updateChat(id, { tagIds: [...new Set(tagIds)] }),
    addLabel: (id,tagId) => updateChat(id,{tagIds:(()=>{const c=chats.find(x=>x.id===id);const a=tagId||tags[0]?.id;return a?[...new Set([...(c?.tagIds||[]),a])]:c?.tagIds||[]})()}),
    removeLabel: (id,tagId) => setChats(prev => prev.map(c => c.id === id ? {...c,tagIds:(c.tagIds||[]).filter(t=>t!==tagId)} : c)),
    removeLabels: (id,tagIds) => setChats(prev => prev.map(c => c.id === id ? {...c,tagIds:(c.tagIds||[]).filter(t=>!tagIds.includes(t))} : c)),
    setPinned: (id, value) => updateChat(id, { pinned:value }),
    setUnread: (id, value) => updateChat(id, { unread:value }),
    matchAskRelation,
    matchSimulateReply,
    matchConfirmAcc,
    openUserDetail,
    openServiceDetail,
    getServices: () => services,
    getServiceContacts: () => serviceContacts,
    getContacts: () => contacts,
    confirmExistingServiceMatch,
    updateContactStatus,
    updateServiceContactRelationship,
  };

  if (loggedOut) {
    return (
      <div data-cc-theme={theme} style={{ display:"flex", height:"100%", minHeight:640, width:"100%", fontFamily:FONT, background:C.bgApp, alignItems:"center", justifyContent:"center", borderRadius:12, border:`1px solid ${C.border}`, "--cc-text": C.text, "--cc-text-soft": C.textSoft, "--cc-bg-panel": C.bgPanel, "--cc-bg-panel-alt": C.bgPanelAlt, "--cc-border": C.border }}>
        <div style={{ textAlign:"center", padding:32 }}>
          <div style={{ width:56, height:56, borderRadius:"50%", background:C.accentSoft, display:"flex", alignItems:"center", justifyContent:"center", margin:"0 auto 16px" }}>
            <User size={26} color={C.accent} />
          </div>
          <h2 style={{ fontSize:16, fontWeight:700, color:C.text }}>Anda telah logout</h2>
          <p style={{ fontSize:12.5, color:C.textFaint, marginTop:6, maxWidth:280 }}>Sesi Customer Care Anda telah diakhiri. Silakan login kembali untuk melanjutkan.</p>
          <button onClick={() => setLoggedOut(false)} style={{ marginTop:18, padding:"9px 18px", border:"none", borderRadius:8, background:C.accent, color:"#fff", fontSize:13, fontWeight:600, cursor:"pointer" }}>Login Kembali</button>
        </div>
      </div>
    );
  }

  return (
    <div data-cc-theme={theme} style={{ display: "flex", height: "100%", minHeight: 640, width: "100%", fontFamily: FONT, background: C.bgApp, overflow: "hidden", borderRadius: 12, border: `1px solid ${C.border}`, "--cc-text": C.text, "--cc-text-soft": C.textSoft, "--cc-bg-panel": C.bgPanel, "--cc-bg-panel-alt": C.bgPanelAlt, "--cc-border": C.border }}>
      <MainMenu active={activeMenu} onChange={changeMenu} activeAccount={activeAccount} onLogoutClick={() => setLogoutConfirmOpen(true)} theme={theme} onThemeToggle={() => setTheme(theme === "light" ? "dark" : "light")} />

      {logoutConfirmOpen && (
        <Modal title="Logout" onClose={() => setLogoutConfirmOpen(false)}>
          <div style={{fontSize:12.5,color:C.textSoft,lineHeight:1.5,marginBottom:14}}>Yakin ingin logout dari akun <b>{activeAccount.name}</b>?</div>
          <div className="flex justify-end gap-2">
            <button onClick={() => setLogoutConfirmOpen(false)} style={{padding:"7px 12px",border:`1px solid ${C.border}`,borderRadius:7,background:C.bgPanel,color:C.textSoft,cursor:"pointer"}}>Batal</button>
            <button onClick={() => { setLogoutConfirmOpen(false); setLoggedOut(true); }} style={{padding:"7px 12px",border:"none",borderRadius:7,background:C.danger,color:"#fff",cursor:"pointer",fontWeight:600}}>Logout</button>
          </div>
        </Modal>
      )}

      {activeMenu === "chat" && (
        <ChatModule
          state={{ chats, contacts, users, services, serviceContacts, tags, templates, selectedChatId, filter, labelFilter, profileOpen, selectionMode, selectedChatIds, deleteConfirmOpen }}
          actions={chatActions}
        />
      )}

      {activeMenu === "tag" && <TagModule tags={tags} setTags={setTags} />}

      {activeMenu === "template" && <TemplateChatModule templates={templates} actions={chatActions} />}

      {activeMenu === "user" && (
        <UserModule
          users={users} services={services} contacts={contacts} serviceContacts={serviceContacts}
          selectedUserId={selectedUserId} openUserDetail={openUserDetail}
          back={() => setSelectedUserId(null)} openServiceDetail={openServiceDetail}
        />
      )}

      {activeMenu === "service" && (
        <ServiceModule
          services={services} users={users} contacts={contacts} serviceContacts={serviceContacts}
          selectedPppoe={selectedPppoe} openServiceDetail={openServiceDetail}
          back={() => setSelectedPppoe(null)} openUserDetail={openUserDetail} onChangePrimary={changePrimary} actions={chatActions}
        />
      )}

      {activeMenu === "contact" && (
        <ContactModule
          contacts={contacts} users={users} services={services} serviceContacts={serviceContacts}
          selectedContactId={selectedContactId} openContactDetail={openContactDetail}
          back={() => setSelectedContactId(null)} openServiceDetail={openServiceDetail} actions={chatActions}
        />
      )}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
</html>
